<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Notation Hero — Catalog Wireframe (low-fi flow sim)</title>

<!-- Final-ish identity: Material Symbols + D3 type. Low-fi on spacing; approved colours. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&family=Geist+Mono:wght@500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=swap" rel="stylesheet">

<style>
/* ---------- approved palette (PR #23 tokens) ---------- */
:root{
  --bg:#0C1117; --panel:#121821; --panel2:#18202B; --elevate:#1C2530;
  --ink:#E8EDF3; --muted:#9AA6B4; --faint:#818B9A;
  --accent:#2DD4BF; --accenthi:#5EEAD4; --onaccent:#06231F;
  --time:#2F6DF6; --danger:#FF6B6B; --learn:#7FA9FF;
  --line:#222C39;
  /* score bands — System G spectrum (dark) */
  --s-low:#E29CC4; --s-dev:#F0A92E; --s-climb:#56B4E9; --s-high:#1FBF8F; --s-gold:#FFD24A; --s-none:#3A4655;
  --radius:12px; --pill:999px; --dur:.18s; --ease:cubic-bezier(.2,.6,.2,1);
}
html[data-theme="light"]{
  --bg:#FFFFFF; --panel:#FBFCFE; --panel2:#F1F4F8; --elevate:#ECF0F5;
  --ink:#0F151C; --muted:#5A6472; --faint:#6B7480;
  --accent:#0F766E; --accenthi:#0D9488; --onaccent:#FFFFFF;
  --danger:#DC2626; --learn:#1D4ED8; --line:#E2E8F0;
  --s-low:#CC79A7; --s-dev:#E69F00; --s-climb:#0072B2; --s-high:#009E73; --s-gold:#B8860B; --s-none:#CBD5E1;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:15px;line-height:1.45}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:600;margin:0}
.mono{font-family:"Geist Mono",monospace;font-variant-numeric:tabular-nums}
.material-symbols-rounded{font-size:20px;line-height:1;vertical-align:middle;user-select:none}
button{font-family:inherit;font-size:inherit;cursor:pointer}
a{color:inherit}

/* ---------- WIREFRAME chrome banner ---------- */
.wf-banner{background:repeating-linear-gradient(45deg,var(--panel2),var(--panel2) 10px,var(--panel) 10px,var(--panel) 20px);
  border-bottom:1px dashed var(--line);padding:5px 14px;font-size:12px;color:var(--muted);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.wf-banner b{color:var(--ink)}
.wf-tg{display:inline-flex;gap:6px;align-items:center}
.wf-tg button{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:var(--pill);padding:3px 10px;font-size:12px}
.wf-tg button[aria-pressed="true"]{background:var(--accent);color:var(--onaccent);border-color:transparent;font-weight:600}

/* ---------- top app bar ---------- */
.topbar{position:sticky;top:0;z-index:30;display:flex;gap:12px;align-items:center;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:9px;font-family:"Bricolage Grotesque";font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.logo svg{width:26px;height:26px;flex:none}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:var(--pill);padding:8px 14px;max-width:560px}
.search input{flex:1;background:none;border:none;outline:none;color:var(--ink);font-size:15px}
.search .material-symbols-rounded{color:var(--faint)}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px;background:transparent;border:1px solid transparent;color:var(--muted)}
.iconbtn:hover{background:var(--panel2);color:var(--ink)}
.iconbtn.ghost-line{border-color:var(--line)}
.acct{display:inline-flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:var(--pill);padding:5px 6px 5px 12px}
.acct .role{font-size:12.5px;color:var(--muted)}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--onaccent);font-weight:700;font-size:13px}
.avatar.anon{background:var(--panel);color:var(--faint);border:1px dashed var(--line)}

/* ---------- layout ---------- */
.wrap{max-width:1080px;margin:0 auto;padding:18px 16px 80px}
.crumbs{display:flex;gap:6px;align-items:center;color:var(--faint);font-size:13px;margin:4px 0 16px;flex-wrap:wrap}
.crumbs a{color:var(--faint);text-decoration:none}
.crumbs a:hover{color:var(--ink)}
.crumbs .material-symbols-rounded{font-size:16px}
.backlink{display:inline-flex;align-items:center;gap:5px;color:var(--muted);background:none;border:none;padding:6px 0;margin-bottom:6px}
.backlink:hover{color:var(--ink)}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{background:none;border:none;color:var(--muted);padding:10px 14px;font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.subtabs{display:flex;gap:8px;margin:-4px 0 14px}
.subtabs button{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:var(--pill);padding:5px 12px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.subtabs button[aria-pressed="true"]{background:var(--elevate);color:var(--ink);border-color:var(--accent)}
.subtabs .material-symbols-rounded{font-size:17px}

/* filter row */
.filterrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:var(--pill);padding:7px 12px;font-size:13.5px}
.chip .k{color:var(--faint)}
.chip:hover{border-color:var(--accent)}
.chip.more{margin-left:auto}
.advanced{display:none;gap:8px;flex-wrap:wrap;padding:10px;background:var(--panel);border:1px dashed var(--line);border-radius:var(--radius);margin-bottom:8px}
.advanced.open{display:flex}

/* continue banner */
.continue{display:flex;align-items:center;gap:14px;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 14%,var(--panel)),var(--panel));border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;margin:6px 0 16px}
.continue .material-symbols-rounded{color:var(--accent)}

/* table */
.tablehead,.row{display:grid;grid-template-columns:1fr 72px 78px 92px 44px;gap:10px;align-items:center}
.tablehead{padding:6px 12px;color:var(--faint);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.row{padding:11px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);margin-bottom:8px;transition:border-color var(--dur) var(--ease)}
.row:hover{border-color:var(--accent);background:var(--panel2)}
.row .name{display:flex;flex-direction:column;gap:2px;cursor:pointer;min-width:0}
.row .name b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .name small{color:var(--faint);display:flex;align-items:center;gap:6px}
.tag{font-size:11px;padding:1px 7px;border-radius:var(--pill);border:1px solid var(--line);color:var(--muted)}
.tag.song{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.tag.lesson{color:var(--learn);border-color:color-mix(in srgb,var(--learn) 40%,transparent)}
.lvlpill{justify-self:start;background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:var(--pill);padding:2px 9px;font-size:12.5px;font-weight:600}
.bpm{color:var(--muted)}
.play{justify-self:center;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--onaccent);border:none}
.play:hover{background:var(--accenthi)}

/* donut */
.donut{position:relative;width:34px;height:34px}
.donut svg{transform:rotate(-90deg)}
.donut .val{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:700;font-family:"Geist Mono"}
.donut.gold .val .material-symbols-rounded{font-size:18px;color:var(--s-gold);font-variation-settings:'FILL' 1}

/* loadmore */
.loadmore{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:14px;color:var(--faint);font-size:13px}
.loadmore button{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:var(--pill);padding:9px 22px}

/* detail */
.hero{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;margin-bottom:8px}
.hero .meta{flex:1;min-width:240px}
.hero h1{font-size:30px;letter-spacing:-.02em}
.hero .sub{color:var(--muted);margin-top:4px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:var(--pill);padding:5px 12px;font-size:13px;color:var(--muted)}
.badge .material-symbols-rounded{font-size:17px;color:var(--faint)}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:10px;padding:11px 20px;font-weight:600;border:1px solid transparent}
.btn.primary{background:var(--accent);color:var(--onaccent)}
.btn.primary:hover{background:var(--accenthi)}
.btn.secondary{background:var(--panel2);color:var(--ink);border-color:var(--line)}
.btn.secondary:hover{border-color:var(--accent)}
.btn.danger{background:transparent;color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,transparent)}
.btn.block{width:100%;justify-content:center}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-top:16px}
.card h3{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h3 .material-symbols-rounded{color:var(--accent);font-size:19px}
.history{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.history .big{display:flex;gap:18px;align-items:center}
.stat{display:flex;flex-direction:column}
.stat .n{font-family:"Geist Mono";font-size:22px;font-weight:700}
.stat .l{color:var(--faint);font-size:12px}
.trend{display:flex;gap:4px;align-items:flex-end;height:46px}
.trend span{flex:1;background:var(--accent);border-radius:3px 3px 0 0;opacity:.75;min-height:4px}
.gate{display:flex;gap:10px;align-items:center;background:var(--panel2);border:1px dashed var(--line);border-radius:var(--radius);padding:14px 16px;color:var(--muted)}
.gate .material-symbols-rounded{color:var(--faint)}

/* steps list (lessons) */
.step{display:flex;gap:14px;align-items:center;padding:13px 14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);margin-bottom:8px}
.step:hover{border-color:var(--accent)}
.step .no{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line);font-family:"Geist Mono";font-weight:700;font-size:13px;color:var(--muted)}
.step .si{flex:1;min-width:0}
.step .si b{font-weight:600}
.step .si small{color:var(--faint);display:block}
.ladder{display:inline-flex;align-items:center;gap:5px;font-family:"Geist Mono";font-size:12.5px;color:var(--muted);background:var(--panel2);border:1px solid var(--line);border-radius:var(--pill);padding:3px 9px}
.src{font-size:11px;padding:1px 7px;border-radius:var(--pill);border:1px solid var(--line);color:var(--faint)}
.src.tex{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.src.slice{color:var(--learn);border-color:color-mix(in srgb,var(--learn) 35%,transparent)}
.src.upload{color:var(--s-dev);border-color:color-mix(in srgb,var(--s-dev) 35%,transparent)}

/* parts (songs) */
.part{display:flex;gap:12px;align-items:center;padding:11px 14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);margin-bottom:8px}
.part .bars{font-family:"Geist Mono";font-size:12px;color:var(--faint);background:var(--panel2);border-radius:var(--pill);padding:2px 9px;border:1px solid var(--line)}

/* player stub */
.playerstub{display:grid;place-items:center;min-height:360px;border:2px dashed var(--line);border-radius:18px;background:repeating-linear-gradient(45deg,var(--panel),var(--panel) 14px,var(--panel2) 14px,var(--panel2) 28px);text-align:center;gap:8px;padding:30px}
.playerstub .material-symbols-rounded{font-size:60px;color:var(--accent)}
.playerstub h2{font-size:24px}
.playerstub .ctx{color:var(--muted);max-width:440px}

/* admin affordances */
.adminbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0;padding:10px 12px;border:1px solid color-mix(in srgb,var(--s-dev) 40%,var(--line));border-radius:var(--radius);background:color-mix(in srgb,var(--s-dev) 8%,var(--panel))}
.adminbar .lbl{display:inline-flex;gap:6px;align-items:center;color:var(--s-dev);font-weight:600;font-size:12.5px;margin-right:auto}
.adminbtn{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:7px 13px;font-size:13.5px}
.adminbtn:hover{border-color:var(--s-dev)}
.adminbtn.danger{color:var(--danger)}

/* stub panel */
.stubpanel{border:2px dashed var(--line);border-radius:18px;padding:28px;text-align:center;color:var(--muted)}
.stubpanel .material-symbols-rounded{font-size:46px;color:var(--faint)}
.stubpanel code{background:var(--panel2);padding:2px 7px;border-radius:6px;font-family:"Geist Mono";font-size:12.5px}

/* modal */
.modalwrap{position:fixed;inset:0;z-index:60;display:none;place-items:center;background:color-mix(in srgb,#000 55%,transparent);padding:20px}
.modalwrap.open{display:grid}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;max-width:380px;width:100%;box-shadow:0 24px 70px rgba(0,0,0,.4)}
.modal h2{font-size:20px;margin-bottom:4px}
.modal p{color:var(--muted);font-size:13.5px;margin:0 0 16px}
.rolepick{display:flex;flex-direction:column;gap:9px}
.rolepick button{display:flex;gap:12px;align-items:center;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:13px 14px;color:var(--ink)}
.rolepick button:hover{border-color:var(--accent)}
.rolepick .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--elevate);color:var(--accent)}
.rolepick b{display:block}
.rolepick small{color:var(--faint)}
.modal .x{float:right;color:var(--faint);background:none;border:none}

.empty{text-align:center;color:var(--faint);padding:50px 20px}
.empty .material-symbols-rounded{font-size:44px;display:block;margin-bottom:8px}
@media(max-width:640px){
  .tablehead{display:none}
  .row{grid-template-columns:1fr 44px;grid-template-areas:"name play" "meta play"}
  .row .name{grid-area:name}.row .play{grid-area:play}
  .row .lvlpill,.row .bpm,.row .donut{display:none}
}
</style>
</head>
<body>

<!-- WIREFRAME controls (toggles you asked for) -->
<div class="wf-banner">
  <b>WIREFRAME</b><span>low-fi flow sim · not final styling</span>
  <span class="wf-tg">Theme:
    <button data-theme-set="dark" aria-pressed="true">Dark</button>
    <button data-theme-set="light" aria-pressed="false">Light</button>
  </span>
  <span class="wf-tg">Role:
    <button data-role-set="anon"  aria-pressed="false">Anonymous</button>
    <button data-role-set="user"  aria-pressed="false">User</button>
    <button data-role-set="admin" aria-pressed="false">Admin</button>
  </span>
  <span style="margin-left:auto;color:var(--faint)" id="routeEcho"></span>
</div>

<!-- TOP APP BAR -->
<header class="topbar">
  <div class="logo" role="button" data-nav="#/catalog" title="Notation Hero — home">
    <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <circle cx="16" cy="16" r="13" stroke="var(--accent)" stroke-width="2.4"/>
      <path d="M13 11l8 5-8 5z" fill="var(--accent)"/>
      <circle cx="11.5" cy="21.5" r="2.4" fill="var(--accenthi)"/>
    </svg>
    Notation&nbsp;Hero
  </div>
  <div class="search">
    <span class="material-symbols-rounded">search</span>
    <input id="q" type="search" placeholder="Search songs &amp; lessons…" autocomplete="off" />
  </div>
  <button class="iconbtn ghost-line" title="MIDI device"><span class="material-symbols-rounded">piano</span></button>
  <button class="iconbtn ghost-line" id="uploadBtn" title="Upload"><span class="material-symbols-rounded">upload</span></button>
  <button class="acct" id="acctBtn" title="Account / switch role">
    <span class="role" id="acctRole">Sign in</span>
    <span class="avatar anon" id="acctAvatar"><span class="material-symbols-rounded">person</span></span>
  </button>
</header>

<main class="wrap" id="app"><!-- screens render here --></main>

<!-- SIGN-IN / ROLE MODAL -->
<div class="modalwrap" id="modal">
  <div class="modal">
    <button class="x" id="modalX"><span class="material-symbols-rounded">close</span></button>
    <h2>Sign in</h2>
    <p>Wireframe stand-in for auth. Pick who you are — the whole app morphs to that role (persisted across reloads).</p>
    <div class="rolepick">
      <button data-role-set="user">
        <span class="ic"><span class="material-symbols-rounded">person</span></span>
        <span><b>Sign in as User</b><small>Track scores &amp; history · upload your own files</small></span>
      </button>
      <button data-role-set="admin">
        <span class="ic"><span class="material-symbols-rounded">shield_person</span></span>
        <span><b>Sign in as Admin</b><small>Curate catalog · add/edit songs, lessons &amp; steps</small></span>
      </button>
      <button data-role-set="anon">
        <span class="ic"><span class="material-symbols-rounded">visibility</span></span>
        <span><b>Stay anonymous</b><small>Browse &amp; play · no saved progress</small></span>
      </button>
    </div>
  </div>
</div>

<script>
/* ====================================================================
   Notation Hero — Catalog wireframe (v1)
   Single-file SPA · hash router (deep-link + reload + back/forward)
   Data shaped to the LOCKED Neon schema (catalogue_item / exercise).
   ==================================================================== */

/* ---------- sample data (mirrors catalogue_item) ---------- */
const ITEMS = [
  // ---- SONGS ----

    data:{bars:48, sections:[{label:'Intro',startBar:1,endBar:8},{label:'Verse',startBar:9,endBar:24},{label:'Chorus',startBar:25,endBar:40},{label:'Outro',startBar:41,endBar:48}]}, breakdown:'sna-breakdown'},

    data:{bars:64, sections:[{label:'Groove',startBar:1,endBar:16},{label:'Verse',startBar:17,endBar:32},{label:'Chorus',startBar:33,endBar:48}]}},
  {id:'rosanna', type:'song', title:'Rosanna (half-time shuffle)', artist:'Toto', level:8, bpm:86, time_sig:'4/4', genre:'rock', instruments:['drums'], status:'published', source:'curated', notation_format:'gp5', best:34, sessions:2, top_bpm:72, trend:[20,28,34]},
  {id:'enter-sandman', type:'song', title:'Enter Sandman', artist:'Metallica', level:5, bpm:123, time_sig:'4/4', genre:'metal', instruments:['drums'], status:'published', source:'curated', notation_format:'gp', best:null, sessions:0, trend:[]},
  {id:'take-five', type:'song', title:'Take Five', artist:'Dave Brubeck', level:6, bpm:174, time_sig:'5/4', genre:'jazz', instruments:['drums'], status:'published', source:'curated', notation_format:'xml', best:52, sessions:4, top_bpm:150, trend:[30,40,48,52]},
  {id:'my-demo-upload', type:'song', title:'My practice loop (upload)', artist:null, level:null, bpm:100, time_sig:'4/4', genre:null, instruments:['drums'], status:'draft', source:'user-upload', notation_format:'gp', best:12, sessions:1, trend:[12], ownedByUser:true},

  // ---- LESSONS ----
  {id:'rock-8th-beat', type:'lesson', title:'8th-Note Rock Beat', level:1, bpm:null, time_sig:'4/4', genre:null, instruments:['drums'], lesson_type:'beat', skill:['timing','coordination'], status:'published', source:'curated', best:64, sessions:3, trend:[30,48,64]},

/* ---------- score donut ---------- */
function band(v){ if(v==null)return 'none'; if(v>=100)return 'gold'; if(v>=89)return 'high'; if(v>=70)return 'climb'; if(v>=50)return 'dev'; return 'low'; }
function donut(v){
  const b = band(v), col = {none:'--s-none',low:'--s-low',dev:'--s-dev',climb:'--s-climb',high:'--s-high',gold:'--s-gold'}[b];
  const pct = v==null?0:v, c=2*Math.PI*14, off=c*(1-pct/100);
  const inner = b==='gold' ? `<span class="val"><span class="material-symbols-rounded">trophy</span></span>` : `<span class="val">${v==null?'–':v}</span>`;
  return `<span class="donut ${b}" title="${v==null?'Not attempted':'Best '+v+'%'}">
    <svg width="34" height="34"><circle cx="17" cy="17" r="14" stroke="var(--s-none)" stroke-width="3.4" fill="none" opacity=".4"/>
    <circle cx="17" cy="17" r="14" stroke="var(${col})" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg>${inner}</span>`;
}

/* ---------- role helpers (ACL) ---------- */
const isAdmin = () => state.role==='admin';

/* ---------- router ---------- */
function parseHash(){
  const raw = location.hash.replace(/^#/,'') || '/catalog';
  const [path, query] = raw.split('?');
  const seg = path.split('/').filter(Boolean);
  const qp = new URLSearchParams(query||'');
  return {seg, qp, raw};
}
function navigate(hash){ location.hash = hash; }                       // pushes history
function replaceHash(hash){ history.replaceState(null,'','#'+hash); }   // no history entry

function syncCatalogHash(){
  const p = new URLSearchParams();
  p.set('tab', state.tab);
  if(state.tab==='lessons' && state.lessonKind!=='all') p.set('kind', state.lessonKind);
  if(state.q) p.set('q', state.q);
  replaceHash('/catalog?'+p.toString());
  el('#routeEcho').textContent = location.hash;
}

function render(){
  document.documentElement.dataset.theme = state.theme;
  paintRoleChrome();
  const {seg, qp} = parseHash();
  el('#routeEcho').textContent = location.hash || '#/catalog';

  if(seg[0]===undefined || seg[0]==='catalog'){
    if(qp.get('tab')) state.tab = qp.get('tab');
    if(qp.get('kind')){ state.lessonKind = qp.get('kind'); }
    if(qp.get('q')!=null) state.q = qp.get('q');
    return renderCatalog();
  }
  if(seg[0]==='song')   return renderSong(seg[1]);
  if(seg[0]==='lesson'){
    if(seg[2]==='step') return renderStep(seg[1], +seg[3]);
    return renderLesson(seg[1]);
  }
  if(seg[0]==='play')   return renderPlayer(qp);
  if(seg[0]==='admin')  return renderAdminStub(seg, qp);
  app.innerHTML = `<div class="empty"><span class="material-symbols-rounded">help</span>Unknown route <code>${esc(location.hash)}</code><br><button class="btn secondary" data-nav="#/catalog" style="margin-top:12px">Back to catalog</button></div>`;
}

function historyCard(it){
  if(!signedIn()) return `<div class="card" style="margin-top:0;min-width:240px">
      <div class="gate"><span class="material-symbols-rounded">login</span><div>Sign in to track your best score, sessions &amp; trend.<br>
      <button class="btn primary" id="signinHere" style="margin-top:10px"><span class="material-symbols-rounded">person</span> Sign in</button></div></div></div>`;
  if(it.best==null) return `<div class="card" style="margin-top:0;min-width:240px"><h3><span class="material-symbols-rounded">history</span> Your history</h3>
      <div class="gate" style="border-style:dashed"><span class="material-symbols-rounded">flag</span>Not attempted yet — play it to start your trend.</div></div>`;
  const tr = (it.trend||[]); const max=Math.max(100,...tr);
  return `<div class="card" style="margin-top:0;min-width:240px">
    <h3><span class="material-symbols-rounded">history</span> Your history</h3>
    <div class="history">
      <div class="big">${donut(it.best)}
        <div class="stat"><span class="n">${it.sessions||0}</span><span class="l">sessions</span></div>
        ${it.top_bpm?`<div class="stat"><span class="n mono">${it.top_bpm}</span><span class="l">top BPM</span></div>`:''}
      </div>
      <div class="trend">${tr.map(v=>`<span style="height:${Math.round(v/max*100)}%"></span>`).join('')||'<small style="color:var(--faint)">no runs yet</small>'}</div>
    </div>
    <small style="color:var(--faint);display:block;margin-top:10px">Per-user data (DynamoDB) — joined client-side, not in the catalog.</small>
  </div>`;
}
function adminDetailBar(it){
  if(!isAdmin()) return '';
  return `<div class="adminbar">
    <span class="lbl"><span class="material-symbols-rounded">shield_person</span>Admin</span>
    <button class="adminbtn" data-nav="#/admin/edit/${it.id}"><span class="material-symbols-rounded">edit</span> Edit ${it.type}</button>
    ${it.type==='lesson'?`<button class="adminbtn" data-nav="#/admin/lesson/${it.id}/step/new"><span class="material-symbols-rounded">add</span> Add step</button>`:''}
    <button class="adminbtn danger" data-nav="#/admin/edit/${it.id}?delete=1"><span class="material-symbols-rounded">delete</span> ${it.status==='published'?'Archive':'Delete'}</button>
  </div>`;
}
function crumbs(parts){
  return `<div class="crumbs">${parts.map((p,i)=>{
    const sep = i>0?'<span class="material-symbols-rounded">chevron_right</span>':'';
    return sep + (p[0]?`<a data-nav="${p[0]}">${p[1]}</a>`:`<span style="color:var(--ink)">${p[1]}</span>`);
  }).join('')}</div>`;
}
function notFound(){ app.innerHTML = `<div class="empty"><span class="material-symbols-rounded">search_off</span>Item not found.<br><button class="btn secondary" data-nav="#/catalog" style="margin-top:12px">Back to catalog</button></div>`; }

/* ---------- role chrome ---------- */
function paintRoleChrome(){
  const av = el('#acctAvatar'), rl = el('#acctRole');
  document.querySelectorAll('[data-role-set]').forEach(b=>b.setAttribute('aria-pressed', b.dataset.roleSet===state.role));
  document.querySelectorAll('[data-theme-set]').forEach(b=>b.setAttribute('aria-pressed', b.dataset.themeSet===state.theme));
  el('#uploadBtn').style.display = signedIn()? 'inline-flex':'none';
  if(state.role==='anon'){ rl.textContent='Sign in'; av.className='avatar anon'; av.innerHTML='<span class="material-symbols-rounded">person</span>'; }
  else if(state.role==='user'){ rl.textContent='User'; av.className='avatar'; av.textContent='U'; }
  else { rl.textContent='Admin'; av.className='avatar'; av.textContent='A'; av.style.background='var(--s-dev)'; }
}

/* ---------- events ---------- */
function setRole(r){ state.role=r; localStorage.setItem('nh_role',r); closeModal(); render(); }
function setTheme(t){ state.theme=t; localStorage.setItem('nh_theme',t); render(); }
function openModal(){ el('#modal').classList.add('open'); }
function closeModal(){ el('#modal').classList.remove('open'); }

document.addEventListener('click', e=>{
  const navEl = e.target.closest('[data-nav]');
  if(navEl){ navigate(navEl.dataset.nav); return; }
  if(e.target.closest('[data-back]')){ history.length>1?history.back():navigate('#/catalog'); return; }
  if(e.target.closest('[data-tab]')){ state.tab=e.target.closest('[data-tab]').dataset.tab; state.shown=8; renderCatalog(); return; }
  if(e.target.closest('[data-kind]')){ state.lessonKind=e.target.closest('[data-kind]').dataset.kind; state.shown=8; renderCatalog(); return; }
  if(e.target.closest('#moreBtn')){ state.advanced=!state.advanced; renderCatalog(); return; }
  if(e.target.closest('#moreRows')){ state.shown+=8; renderCatalog(); return; }
  if(e.target.closest('#clearFilters')){ state.q=''; el('#q').value=''; state.lessonKind='all'; renderCatalog(); return; }
  if(e.target.closest('[data-role-set]')){ setRole(e.target.closest('[data-role-set]').dataset.roleSet); return; }
  if(e.target.closest('[data-theme-set]')){ setTheme(e.target.closest('[data-theme-set]').dataset.themeSet); return; }
  if(e.target.closest('#acctBtn') || e.target.closest('#signinHere')){ openModal(); return; }
  if(e.target.closest('#modalX') || e.target===el('#modal')){ closeModal(); return; }
  if(e.target.closest('#uploadBtn')){ navigate('#/admin/new?type=upload'); return; }
});
el('#q').addEventListener('input', e=>{ state.q=e.target.value; state.shown=8; const onCat=(parseHash().seg[0]||'catalog')==='catalog'; if(onCat) renderCatalog(); else navigate('#/catalog'); });
window.addEventListener('hashchange', ()=>{ render(); window.scrollTo(0,0); });
window.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

/* ---------- boot ---------- */
render();
</script>
</body>
</html>
