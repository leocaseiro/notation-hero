<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" /><meta http-equiv="Pragma" content="no-cache" /><meta http-equiv="Expires" content="0" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Notation Hero — Catalog Wireframe (low-fi flow sim)</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&family=Geist+Mono:wght@500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0C1117; --panel:#121821; --panel2:#18202B; --elevate:#1C2530;
  --ink:#E8EDF3; --muted:#9AA6B4; --faint:#818B9A;
  --accent:#2DD4BF; --accenthi:#5EEAD4; --onaccent:#06231F;
  --time:#2F6DF6; --danger:#FF6B6B; --learn:#7FA9FF;
  --line:#222C39;
  --s-low:#E29CC4; --s-dev:#F0A92E; --s-climb:#56B4E9; --s-high:#1FBF8F; --s-gold:#FFD24A; --s-none:#3A4655;
  --radius:12px; --pill:999px; --dur:.18s; --ease:cubic-bezier(.2,.6,.2,1);
}
html[data-theme="light"]{
  --bg:#FFFFFF; --panel:#FBFCFE; --panel2:#F1F4F8; --elevate:#ECF0F5;
  --ink:#0F151C; --muted:#5A6472; --faint:#6B7480;
  --accent:#0F766E; --accenthi:#0D9488; --onaccent:#FFFFFF;
  --danger:#DC2626; --learn:#1D4ED8; --line:#E2E8F0;
  --s-low:#CC79A7; --s-dev:#E69F00; --s-climb:#0072B2; --s-high:#009E73; --s-gold:#B8860B; --s-none:#CBD5E1;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:15px;line-height:1.45}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:600;margin:0}
.mono{font-family:"Geist Mono",monospace;font-variant-numeric:tabular-nums}
.material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;font-size:20px;line-height:1;vertical-align:middle;user-select:none;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.msf{font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24}
button{font-family:inherit;font-size:inherit;cursor:pointer}
a{color:inherit}

.wf-banner{background:repeating-linear-gradient(45deg,var(--panel2),var(--panel2) 10px,var(--panel) 10px,var(--panel) 20px);
  border-bottom:1px dashed var(--line);padding:5px 14px;font-size:12px;color:var(--muted);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.wf-banner b{color:var(--ink)}
.wf-tg{display:inline-flex;gap:6px;align-items:center}
.wf-tg button{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:var(--pill);padding:3px 10px;font-size:12px}
.wf-tg button[aria-pressed="true"]{background:var(--accent);color:var(--onaccent);border-color:transparent;font-weight:600}

.topbar{position:sticky;top:0;z-index:30;display:flex;gap:12px;align-items:center;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:9px;font-family:"Bricolage Grotesque";font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.mark{width:30px;height:27px;color:var(--accent);display:inline-grid;place-items:center;flex:none}
.mark svg{width:100%;height:100%;overflow:visible}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:var(--pill);padding:8px 14px;max-width:560px}
.search input{flex:1;background:none;border:none;outline:none;color:var(--ink);font-size:15px}
.search .material-symbols-outlined{color:var(--faint)}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px;background:transparent;border:1px solid var(--line);color:var(--muted)}
.iconbtn:hover{background:var(--panel2);color:var(--ink)}
.midi{width:40px;height:40px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);background:transparent;border:1px solid var(--line);position:relative}
.midi:hover{color:var(--ink);border-color:var(--accent)}
.midi svg{width:22px;height:22px;fill:currentColor}
.acct{display:inline-flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:var(--pill);padding:5px 6px 5px 12px}
.acct .role{font-size:12.5px;color:var(--muted)}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--onaccent);font-weight:700;font-size:13px}
.avatar.anon{background:var(--panel);color:var(--faint);border:1px dashed var(--line)}

.wrap{max-width:1080px;margin:0 auto;padding:18px 16px 80px}
.crumbs{display:flex;gap:6px;align-items:center;color:var(--faint);font-size:13px;margin:4px 0 16px;flex-wrap:wrap}
.crumbs a{color:var(--faint);text-decoration:none}
.crumbs a:hover{color:var(--ink)}
.crumbs .material-symbols-outlined{font-size:16px}
.backlink{display:inline-flex;align-items:center;gap:5px;color:var(--muted);background:none;border:none;padding:6px 0;margin-bottom:6px}
.backlink:hover{color:var(--ink)}

.frow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0 14px}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--muted);padding:6px 13px;border-radius:8px;font-weight:600;font-size:13.5px}
.seg button.sel{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.seg .material-symbols-outlined{font-size:17px}
.vsep{width:1px;height:24px;background:var(--line)}
.fdrop{position:relative}
.fbtn{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:var(--pill);padding:7px 12px;font-size:13.5px}
.fbtn:hover{border-color:var(--accent)}
.fbtn.on{background:color-mix(in srgb,var(--accent) 12%,transparent);border-color:var(--accent);color:var(--accent)}
.fbtn.on .k{color:var(--accent)}
.fbtn .k{color:var(--faint)}
.fbtn .caret{font-size:17px;color:var(--faint)}
.fpop{position:absolute;top:calc(100% + 6px);left:0;z-index:45;min-width:210px;background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 44px rgba(0,0,0,.34);padding:7px;display:none}
.fpop.open{display:block}
.fpop.r{left:auto;right:0}
.opsel{font-size:11.5px;color:var(--faint);padding:4px 8px 8px;text-transform:uppercase;letter-spacing:.05em}
.fopt{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;font-size:13.5px;color:var(--ink);cursor:pointer}
.fopt:hover{background:var(--panel2)}
.fopt .box{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;color:var(--onaccent)}
.fopt .box .material-symbols-outlined{font-size:13px;opacity:0}
.fopt.on .box{background:var(--accent);border-color:var(--accent)} .fopt.on .box .material-symbols-outlined{opacity:1}
.fopt .radio{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line);flex:none;position:relative}
.fopt.on .radio{border-color:var(--accent)} .fopt.on .radio::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent)}
.fopt .ic{color:var(--faint);font-size:18px}
.fopt.on{color:var(--accent)} .fopt.on .ic{color:var(--accent)}
.fpop .foot{border-top:1px solid var(--line);margin-top:5px;padding-top:5px;display:flex;justify-content:space-between;align-items:center}
.fpop .foot a{color:var(--accent);font-size:12.5px;font-weight:600;cursor:pointer;padding:6px 9px}
.rangerow{display:flex;align-items:center;gap:8px;padding:6px 8px}
.rangerow label{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.04em}
.rangerow select,.rangerow input{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 8px;font-size:13px;font-family:inherit;width:84px}
.rangerow .dash{color:var(--faint)}
.sortwrap .caret{font-size:17px;color:var(--faint)}
.advanced{display:none;gap:14px;flex-wrap:wrap;padding:12px 14px;background:var(--panel);border:1px dashed var(--line);border-radius:var(--radius);margin-bottom:12px;align-items:center}
.advanced.open{display:flex}
.advsec{display:flex;align-items:center;gap:8px}
.advsec .albl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:700}

.continue{display:flex;align-items:center;gap:14px;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 14%,var(--panel)),var(--panel));border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;margin:6px 0 16px;cursor:pointer}
.continue .material-symbols-outlined{color:var(--accent)}

.tablehead,.row{display:grid;grid-template-columns:1fr 88px 84px 60px 44px;gap:10px;align-items:center}
.tablehead{padding:6px 12px;color:var(--faint);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.stephead{display:flex;gap:14px;align-items:center;padding:0 14px 6px;color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.tablehead span:nth-child(2){text-align:center}.tablehead span:nth-child(3){text-align:right}.tablehead span:nth-child(4){text-align:center}
.row{padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);margin-bottom:8px;transition:border-color var(--dur) var(--ease)}
.row:hover{border-color:var(--accent);background:var(--panel2)}
.name{display:flex;align-items:center;gap:11px;min-width:0}
.cover{width:38px;height:38px;border-radius:10px;flex:none;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
.cover.lesson{background:color-mix(in srgb,var(--learn) 15%,transparent);color:var(--learn)}
.cover .material-symbols-outlined{font-size:21px}
.nm{flex:1;min-width:0;cursor:pointer}
.nmtitle{font-weight:600;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.nmtitle b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nmsub{color:var(--muted);font-size:12px;margin-top:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.badge2{font-size:10px;text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:2px 7px;border-radius:var(--pill);border:1px solid var(--line);color:var(--muted)}
.badge2.beat{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.badge2.rudiment{color:var(--learn);border-color:color-mix(in srgb,var(--learn) 40%,transparent)}
.badge2.fill{color:var(--s-dev);border-color:color-mix(in srgb,var(--s-dev) 40%,transparent)}
.badge2.song-breakdown{color:var(--s-climb);border-color:color-mix(in srgb,var(--s-climb) 40%,transparent)}
.pill-new{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:var(--pill);background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.tag{font-size:11px;padding:1px 7px;border-radius:var(--pill);border:1px solid var(--line);color:var(--muted)}
.tag.song{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.tag.lesson{color:var(--learn);border-color:color-mix(in srgb,var(--learn) 40%,transparent)}
.tag.private{color:var(--s-dev);border-color:color-mix(in srgb,var(--s-dev) 45%,transparent)}
.flags{display:inline-flex;gap:6px;color:var(--faint);margin-left:auto;padding-left:10px;flex:none}
.flags .material-symbols-outlined{font-size:16px}
.flags .parts{color:var(--accent)}
.dot{width:3px;height:3px;border-radius:50%;background:var(--faint);display:inline-block}
.lvlpill{justify-self:center;background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:var(--pill);padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.lvlpill.debut{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.bpm{color:var(--muted);text-align:right;font-size:13px}
.play{justify-self:center;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--onaccent);border:none}
.play:hover{background:var(--accenthi)}

.donut{position:relative;width:34px;height:34px;justify-self:center}
.donut svg{transform:rotate(-90deg)}
.donut .val{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:700;font-family:"Geist Mono"}
.donut.gold .val .material-symbols-outlined{font-size:18px;color:var(--s-gold)}
.nfields{grid-column:1/-1;display:none;margin:8px 0 2px;border-top:1px dashed var(--line);padding-top:8px}
body.showall .nfields{display:block}
.nfsub{margin:7px 0 3px;font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em}
.nfgrid{display:grid;grid-template-columns:max-content 1fr;gap:2px 16px;font-family:"Geist Mono",ui-monospace,monospace;font-size:11.5px;align-items:start}
.nfk{color:var(--faint)}
.nfv{color:var(--ink);word-break:break-word;white-space:pre-wrap}
.nfv.nul{color:var(--s-none)}
.fielddock{display:none;position:fixed;top:64px;right:14px;width:460px;max-height:80vh;overflow:auto;resize:both;background:var(--panel);border:1px solid var(--accent);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.4);z-index:40}
body.showall .fielddock{display:block}
.fdhead{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 12px;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);display:flex;align-items:center;gap:6px;font-weight:600}
.fdbody{padding:10px 12px}
[data-nav]{cursor:pointer}
.logo[data-nav]:hover{color:var(--accent)}
.patrow[data-nav]{cursor:pointer}
.part[data-nav]:hover,.patrow[data-nav]:hover{border-color:var(--accent);background:var(--panel2)}

.pager{display:flex;gap:6px;align-items:center;justify-content:center;margin-top:16px;flex-wrap:wrap}
.pager button{min-width:34px;height:34px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:0 8px;display:inline-flex;align-items:center;justify-content:center}
.pager button[aria-current="true"]{background:var(--accent);color:var(--onaccent);border-color:transparent;font-weight:700}
.pager button:hover:not([aria-current="true"]):not(:disabled){border-color:var(--accent)}
.pager button:disabled{opacity:.4;cursor:default}
.pager .info{color:var(--faint);font-size:12.5px;margin-left:8px}
.loadmore{display:flex;justify-content:center;margin-top:14px;color:var(--faint);font-size:13px}

.hero{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;margin-bottom:8px}
.hero .meta{flex:1;min-width:240px}
.hero h1{font-size:30px;letter-spacing:-.02em}
.hero .sub{color:var(--muted);margin-top:4px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:var(--pill);padding:5px 12px;font-size:13px;color:var(--muted)}
.badge .material-symbols-outlined{font-size:17px;color:var(--faint)}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:10px;padding:11px 20px;font-weight:600;border:1px solid transparent}
.btn.primary{background:var(--accent);color:var(--onaccent)}
.btn.primary:hover{background:var(--accenthi)}
.btn.secondary{background:var(--panel2);color:var(--ink);border-color:var(--line)}
.btn.secondary:hover{border-color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-top:16px}
.card h3{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h3 .material-symbols-outlined{color:var(--accent);font-size:19px}
.history{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.history .big{display:flex;gap:18px;align-items:center}
.stat{display:flex;flex-direction:column}
.stat .n{font-family:"Geist Mono";font-size:22px;font-weight:700}
.stat .l{color:var(--faint);font-size:12px}
.trend{display:flex;gap:4px;align-items:flex-end;height:46px}
.trend span{flex:1;background:var(--accent);border-radius:3px 3px 0 0;opacity:.75;min-height:4px}
.gate{display:flex;gap:10px;align-items:center;background:var(--panel2);border:1px dashed var(--line);border-radius:var(--radius);padding:14px 16px;color:var(--muted)}
.gate .material-symbols-outlined{color:var(--faint)}

/* relationships: patterns / media / source */
.patrow{display:flex;gap:11px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);margin-bottom:7px;cursor:default}
.patrow .pk{font-size:10px;text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:2px 7px;border-radius:var(--pill);border:1px solid var(--line)}
.patrow .pk.beat{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.patrow .pk.fill{color:var(--s-dev);border-color:color-mix(in srgb,var(--s-dev) 40%,transparent)}
.patrow .pk.rudiment{color:var(--learn);border-color:color-mix(in srgb,var(--learn) 40%,transparent)}
.media{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.medialink{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:var(--pill);padding:6px 12px;font-size:13px;color:var(--ink)}
.medialink:hover{border-color:var(--accent)}
.medialink .material-symbols-outlined{font-size:17px;color:var(--accent)}
.metafoot{color:var(--faint);font-size:12.5px;margin-top:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.metafoot .material-symbols-outlined{font-size:15px}

.step{display:flex;gap:14px;align-items:center;padding:13px 14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);margin-bottom:8px}
.step:hover{border-color:var(--accent)}
.step .no{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line);font-family:"Geist Mono";font-weight:700;font-size:13px;color:var(--muted)}
.step .si{flex:1;min-width:0;cursor:pointer}
.step .si b{font-weight:600}
.step .si small{color:var(--faint);display:block}
.stepwrap{margin-bottom:8px}
.stepwrap .step{margin-bottom:0}
.ladder{display:inline-flex;align-items:center;gap:5px;font-family:"Geist Mono";font-size:12.5px;color:var(--muted);background:var(--panel2);border:1px solid var(--line);border-radius:var(--pill);padding:3px 9px}
.src{font-size:11px;padding:1px 7px;border-radius:var(--pill);border:1px solid var(--line);color:var(--faint)}
.src.tex{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.src.slice{color:var(--learn);border-color:color-mix(in srgb,var(--learn) 35%,transparent)}
.src.upload{color:var(--s-dev);border-color:color-mix(in srgb,var(--s-dev) 35%,transparent)}

.part{display:flex;gap:12px;align-items:center;padding:11px 14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);margin-bottom:8px}
.part .bars{font-family:"Geist Mono";font-size:12px;color:var(--faint);background:var(--panel2);border-radius:var(--pill);padding:2px 9px;border:1px solid var(--line)}

.playerstub{display:grid;place-items:center;min-height:360px;border:2px dashed var(--line);border-radius:18px;background:repeating-linear-gradient(45deg,var(--panel),var(--panel) 14px,var(--panel2) 14px,var(--panel2) 28px);text-align:center;gap:8px;padding:30px}
.playerstub .material-symbols-outlined{font-size:60px;color:var(--accent)}
.playerstub h2{font-size:24px}
.playerstub .ctx{color:var(--muted);max-width:440px}

.adminbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0;padding:10px 12px;border:1px solid color-mix(in srgb,var(--s-dev) 40%,var(--line));border-radius:var(--radius);background:color-mix(in srgb,var(--s-dev) 8%,var(--panel))}
.adminbar .lbl{display:inline-flex;gap:6px;align-items:center;color:var(--s-dev);font-weight:600;font-size:12.5px;margin-right:auto}
.adminbtn{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:7px 13px;font-size:13.5px}
.adminbtn:hover{border-color:var(--s-dev)}
.adminbtn.danger{color:var(--danger)}

.stubpanel{border:2px dashed var(--line);border-radius:18px;padding:28px;text-align:center;color:var(--muted)}
.stubpanel .material-symbols-outlined{font-size:46px;color:var(--faint)}
.stubpanel code{background:var(--panel2);padding:2px 7px;border-radius:6px;font-family:"Geist Mono";font-size:12.5px}

.modalwrap{position:fixed;inset:0;z-index:60;display:none;place-items:center;background:color-mix(in srgb,#000 55%,transparent);padding:20px}
.modalwrap.open{display:grid}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;max-width:380px;width:100%;box-shadow:0 24px 70px rgba(0,0,0,.4)}
.modal h2{font-size:20px;margin-bottom:4px}
.modal p{color:var(--muted);font-size:13.5px;margin:0 0 16px}
.rolepick{display:flex;flex-direction:column;gap:9px}
.rolepick button{display:flex;gap:12px;align-items:center;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:13px 14px;color:var(--ink)}
.rolepick button:hover{border-color:var(--accent)}
.rolepick .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--elevate);color:var(--accent)}
.rolepick b{display:block}
.rolepick small{color:var(--faint)}
.modal .x{float:right;color:var(--faint);background:none;border:none}

.lead{color:var(--muted);max-width:64ch;margin-top:10px;font-size:14px;line-height:1.5}
.voices{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0 0 10px}
.vchip{font-size:11px;padding:2px 8px;border-radius:var(--pill);border:1px solid var(--line);color:var(--ink);background:var(--panel2)}
.vlbl{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);margin-right:2px}
.vnote{font-size:11px;color:var(--faint)}
.tracklens{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 10%,var(--panel)),var(--panel));border:1px solid var(--line);border-radius:var(--radius);padding:11px 14px;margin:16px 0;flex-wrap:wrap}
.tracklens label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:700}
.tracklens select{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:7px 10px;font-family:inherit;font-size:14px;font-weight:600}
.tracklens select:hover{border-color:var(--accent)}
.tracklens .lenstune{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);background:var(--panel2);border:1px solid var(--line);border-radius:var(--pill);padding:3px 9px}
.tracklens .lenshint{color:var(--faint);font-size:12px;margin-left:auto}
.mediscope{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);margin:12px 0 6px}
.techs{display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap;margin-left:8px;min-width:96px}
.technone{color:var(--faint);opacity:.5}
.nfjson{font-family:"Geist Mono",ui-monospace,monospace;font-size:11.5px;line-height:1.5;color:var(--ink);white-space:pre;overflow:auto;margin:6px 0 0}
.nfjson .jk{color:var(--accent)}
.nfjson .jnull{color:var(--faint);opacity:.75}
.empty{text-align:center;color:var(--faint);padding:50px 20px}
.empty .material-symbols-outlined{font-size:44px;display:block;margin-bottom:8px}
@media(max-width:640px){
  .tablehead{display:none}
  .row{grid-template-columns:1fr 44px;grid-template-areas:"name play" "meta play"}
  .row .name{grid-area:name}.row .play{grid-area:play}
  .row .lvlpill,.row .bpm,.row .donut{display:none}
}

}

function usedInCard(items, note){

}

  return (it.instruments||[]).map((inst,i)=>({id:it.id+'-'+inst, instrument:inst, role:null, name:cap(inst), level:it.level??null, notation_track_index:i, synthetic:true}));

const mediaOf    = it => it.media || [];
const songMedia  = it => mediaOf(it).filter(m=>m.scope!=='track');
const trackMedia = (it,tid) => mediaOf(it).filter(m=>m.scope==='track' && m.track===tid);
const derivedInstruments = it => [...new Set(tracksOf(it).map(t=>t.instrument))].sort();   // D-1a facet = DISTINCT track.instrument
function levelRange(tracks){ const ls=tracks.map(t=>t.level).filter(v=>v!=null); if(!ls.length) return null; return {lo:Math.min(...ls), hi:Math.max(...ls)}; }
const lvlText   = v => v==null?'—':(v===0?'Debut':'L'+v);
const rangeText = r => !r ? '—' : (r.lo===r.hi ? lvlText(r.lo) : `${r.lo===0?'Debut':'L'+r.lo}–${r.hi}`);
/* the track the detail page is scoped to: explicit selection → instrument-lens match → first track */
function defaultTrackId(it){ const ts=tracksOf(it); if(state.instrument){ const m=ts.find(t=>t.instrument===state.instrument); if(m) return m.id; } return ts[0]?.id || null; }
function selectedTrack(it){ const ts=tracksOf(it); return ts.find(t=>t.id===state.track) || ts.find(t=>t.id===defaultTrackId(it)) || ts[0] || null; }
/* what the catalog row shows for Level: instrument-lens → that instrument's track level(s); else the full range across tracks */
function rowLevelText(it){
  const ts=tracksOf(it);
  const scoped = state.instrument ? ts.filter(t=>t.instrument===state.instrument) : ts;
  const r = levelRange(scoped.length?scoped:ts);
  return r ? rangeText(r) : lvlText(it.level);
}

/* ---------- router ---------- */
function parseHash(){
  const raw = location.hash.replace(/^#/,'') || '/catalog';
  const [path, query] = raw.split('?');
  return {seg:path.split('/').filter(Boolean), qp:new URLSearchParams(query||''), raw};
}
function navigate(hash){ location.hash = hash; }
function replaceHash(hash){ history.replaceState(null,'','#'+hash); el('#routeEcho').textContent = location.hash; }
function syncCatalogHash(){
  const p = new URLSearchParams();
  p.set('tab', state.tab);
  if(state.tab==='lessons' && state.kind.length) p.set('kind', state.kind.join(','));
  if(state.genre.length) p.set('genre', state.genre.join(','));
  if(state.artist) p.set('artist', state.artist);
  if(state.q) p.set('q', state.q);
  if(state.sort!=='relevance') p.set('sort', state.sort);
  if(state.page>1) p.set('page', state.page);
  replaceHash('/catalog?'+p.toString());
}

function render(){
  document.documentElement.dataset.theme = state.theme;
  paintRoleChrome();
  const {seg, qp} = parseHash();
  el('#routeEcho').textContent = location.hash || '#/catalog';
  el('#topBack').style.display = (seg[0]===undefined||seg[0]==='catalog') ? 'none' : 'inline-flex';   // iPhone-style back, only on sub-pages
  if(seg[0]===undefined || seg[0]==='catalog'){
    if(qp.get('tab')) state.tab = qp.get('tab');
    if(qp.get('kind')) state.kind = qp.get('kind').split(',');
    if(qp.get('genre')) state.genre = qp.get('genre').split(',');
    state.artist = qp.get('artist') || null;
    if(qp.get('q')!=null) state.q = qp.get('q');
    if(qp.get('sort')) state.sort = qp.get('sort');
    state.page = +(qp.get('page')||1);
    return renderCatalog();
  }
  if(seg[0]==='song')   return seg[2]==='section' ? renderSongSection(seg[1], +seg[3]) : renderSong(seg[1]);
  if(seg[0]==='part')   return renderPart(seg[1]);
  if(seg[0]==='pattern') return renderPattern(seg[1]);
  if(seg[0]==='lesson') return seg[2]==='step' ? renderStep(seg[1], +seg[3]) : renderLesson(seg[1]);
  if(seg[0]==='play')   return renderPlayer();
  if(seg[0]==='admin')  return renderAdminStub(seg, qp);
  app.innerHTML = `<div class="empty"><span class="material-symbols-outlined">help</span>Unknown route <code>${esc(location.hash)}</code><br><button class="btn secondary" data-nav="#/catalog" style="margin-top:12px">Back to catalog</button></div>`;
}

/* ---------- filtering + sorting ---------- */
function matches(it){
  if(it.listable===false) return false;                                          // parts (and any listable:false playable) never appear in browse
  if(state.tab==='songs' ? it.kind!=='song' : it.kind==='song') return false;   // Lessons tab = every non-song (lessons + patterns)
  if(state.genre.length && !state.genre.includes(it.genre)) return false;
  if(state.tab==='songs' && state.artist && it.artist!==state.artist) return false;   // SD-13 artist facet (songs)
  if(state.tab==='lessons' && state.kind.length && !state.kind.some(k=>patternKindsOf(it).includes(k))) return false;   // Kind filter spans patterns (own kind) + lessons (derived from step children)
  if(state.timeSig.length && !state.timeSig.includes(it.time_sig)) return false;
  if(state.instrument && !(it.instruments||[]).includes(state.instrument)) return false;
  if(state.level.min!=null || state.level.max!=null){
    // per-instrument: when an instrument is selected, filter on THAT instrument's
    // headline (max of its tracks), not the song's overall headline (SD-27 / T3).
    // e.g. Zoio guitar = L3-4, so "Guitar + level>=9" must NOT match it (drums L9 does).
    let lv = it.level;
    if(state.instrument){ const ls=tracksOf(it).filter(t=>t.instrument===state.instrument).map(t=>t.level).filter(v=>v!=null); if(ls.length) lv=Math.max(...ls); }
    if(lv==null){ if(!state.inclUngraded) return false; }
    else { if(state.level.min!=null && lv<state.level.min) return false; if(state.level.max!=null && lv>state.level.max) return false; }
  }
  if(state.bpm.min!=null && (it.bpm==null || it.bpm<state.bpm.min)) return false;
  if(state.bpm.max!=null && (it.bpm==null || it.bpm>state.bpm.max)) return false;
  if(signedIn() && (state.score.min!=null || state.score.max!=null)){   // SD-12 (per-user; client-side here)
    if(it.best==null){ if(!state.inclUnplayed) return false; }
    else { if(state.score.min!=null && it.best<state.score.min) return false; if(state.score.max!=null && it.best>state.score.max) return false; }
  }
  if(state.skill.length && !state.skill.every(s=>(it.skill||[]).includes(s))) return false;
  if(isPitched() && state.musicalKey.length && !state.musicalKey.includes(it.musical_key)) return false;
  if(state.q){ const t=(it.title+' '+(it.artist||'')).toLowerCase(); if(!t.includes(state.q.toLowerCase())) return false; }
  if(!isAdmin() && it.status!=='published' && !(it.ownedByUser && signedIn())) return false;
  return true;
}
function sortItems(arr){
  const c=[...arr], s=state.sort;
  if(s==='level') c.sort((a,b)=>(a.level==null?99:a.level)-(b.level==null?99:b.level));
  else if(s==='bpm') c.sort((a,b)=>(a.bpm==null?1e9:a.bpm)-(b.bpm==null?1e9:b.bpm));
  else if(s==='best') c.sort((a,b)=>(b.best==null?-1:b.best)-(a.best==null?-1:a.best));
  else if(s==='title') c.sort((a,b)=>a.title.localeCompare(b.title));
  else if(s==='newest') c.sort((a,b)=>(b.new?1:0)-(a.new?1:0));
  return c;
}

function multiFace(label, arr, fmt){ if(!arr.length) return `<span class="k">${label}:</span> Any`; const f=fmt||cap; return `<span class="k">${label}:</span> ${f(arr[0])}${arr.length>1?' +'+(arr.length-1):''}`; }
function rangeFace(label, r, fmt){ const f=fmt||(x=>x); if(r.min==null&&r.max==null) return `<span class="k">${label}:</span> Any`; if(r.min!=null&&r.max!=null) return `<span class="k">${label}:</span> ${f(r.min)}–${f(r.max)}`; if(r.max!=null) return `<span class="k">${label}:</span> ≤ ${f(r.max)}`; return `<span class="k">${label}:</span> ≥ ${f(r.min)}`; }

/* ---- all-fields inspector (Fields toggle): map an item to the playable model + render every column ---- */
function nfv(v){
  if(v===null||v===undefined||v==='') return '<span class="nfv nul">∅ null</span>';

function toPlayable(it){
  const ts = it.time_sig ? String(it.time_sig).split('/') : [null,null];
  return {
    id:it.id, kind:it.kind, title:it.title, description: descOf(it),
    parent_id: it.parent_id||it.sourceSong||null,

    start_bar: it.start_bar??null, end_bar: it.end_bar??null, sort_order: it.sort_order??null,

    time_signature_numerator: ts[0]?Number(ts[0]):null, time_signature_denominator: ts[1]?Number(ts[1]):null,

    has_audio: !!it.has_audio, has_video: !!it.has_video,
    data: it.data||null, created_by: it.owner||null,
  };
}
const NF_ORDER = ['id','kind','title','description','parent_id','notation_id','start_bar','end_bar','sort_order','listable','level','artist','bpm','time_signature_numerator','time_signature_denominator','genre','musical_key','instruments','skill','tags','pattern_kind','family','origin','status','license','has_audio','has_video','data','created_by'];
/* assemble the playable + its joins (notation, tracks, media) into one object for the inspector */
function inspectorObject(it){
  const n = toPlayable(it);
  const obj = { playable: n };
  if(n.notation_id){
    obj.notation = {
      id: n.notation_id,
      format: it.notation_format || (it.notation_alphaTex ? 'alphatex' : null),
      s3_key: it.notation_format ? ('catalogue/'+it.id+'/source.'+it.notation_format) : null,
      notation_alphaTex: it.notation_alphaTex || null,
    };
  }
  obj.tracks = (it.tracks || tracksOf(it)).map(t=>({
    instrument: t.instrument, role: t.role||null, name: t.name||null,
    level: t.level??null, notation_id: t.notation_id||null,
    notation_track_index: t.notation_track_index??null,
    data: t.tuning ? { tuning: t.tuning } : {},
  }));
  obj.media = (it.media||[]).map(m=>({
    scope: m.scope==='track' ? 'track' : 'song', track_id: m.track||null,
    kind: m.kind, provider: m.provider,
    url: m.url||null, s3_key: m.s3_key||null, label: m.label||null,
  }));
  return obj;
}

  s = s.replace(/\bnull\b/g, '<span class="jnull">null</span>');
  return s;
}

function rowHTML(it){

    : `${it.genre?cap(it.genre)+' ':''}<span class="dot"></span> ${it.time_sig} <span class="dot"></span> ${(it.instruments||[]).join('·')}${it.musical_key?' <span class="dot"></span> '+it.musical_key:''}`;
  const bpm = isLesson ? lessonLadder(it) : isPat ? '—' : (it.bpm||'—');
  const lvlTxt = rowLevelText(it);                                   // L1 range across tracks, or the lens instrument's track level

  return `<div class="row">
    <div class="name">

function pager(total, pages){
  if(pages<=1) return `<div class="loadmore">${total} item${total===1?'':'s'}</div>`;

  for(let p=1;p<=pages;p++) btns+=`<button data-page="${p}" aria-current="${p===state.page}">${p}</button>`;
  return `<div class="pager">

}

/* ---------- relationship + meta blocks (READ deepening) ---------- */
function patternsCard(it){
  if(!it.patterns||!it.patterns.length) return '';
  return `<div class="card"><h3><span class="material-symbols-outlined">extension</span> Patterns ${it.kind==='song'?'in this song':'this lesson teaches'} <span style="font-weight:400;color:var(--faint)">· reusable grooves / fills / rudiments</span></h3>
    ${it.patterns.map(pid=>{ const pl=childPlayable(pid), d=PATTERNS[pid]; if(!pl&&!d) return ''; const pk=(pl&&pl.pattern_kind)||(d&&d.kind); const k=PATTERN_KINDS[pk]||{label:pk||'Pattern',icon:'extension'}; const title=(pl&&pl.title)||(d&&d.name)||pid; const fam=(pl&&pl.family)||(d&&d.family); const lvl=(pl?pl.level:(d&&d.level));
      return `<div class="patrow" data-nav="#/pattern/${pid}"><span class="material-symbols-outlined" style="color:var(--accent)">${k.icon}</span>
        <div style="flex:1"><b>${esc(title)}</b><small style="color:var(--faint);display:block">${[k.label,fam,'level '+(lvl??'—')].filter(Boolean).join(' · ')}</small></div>
        ${pl?donut(pl.best):''}<span class="pk ${pk}">${k.label}</span><span class="material-symbols-outlined" style="color:var(--faint)">chevron_right</span></div>`; }).join('')}

}
function mediaLinks(it){
  const m=[...(it.video||[]).map(v=>({i:'smart_display',l:v.label||'Video'})), ...(it.audio||[]).map(a=>({i:'volume_up',l:a.label||'Audio'}))];
  if(!m.length) return '';

}
/* D-1/D-2/D-3 — the instrument+track LENS: every detail page is scoped to ONE track (Leo's model). */
function trackLens(it){
  const ts = tracksOf(it); const sel = selectedTrack(it);
  if(!sel) return '';
  const opts = ts.map(t=>`<option value="${esc(t.id)}" ${t.id===sel.id?'selected':''}>${esc(t.name||cap(t.instrument))}${t.role?' · '+esc(t.role):''} — ${lvlText(t.level)}</option>`).join('');
  return `<div class="tracklens">
    <span class="material-symbols-outlined" style="color:var(--accent)">${instIcon(sel.instrument)}</span>
    <label for="trackSel">Playing</label>
    <select id="trackSel" data-track-sel>${opts}</select>
    ${sel.tuning?`<span class="lenstune"><span class="material-symbols-outlined" style="font-size:15px">tune</span>${esc(sel.tuning)}</span>`:''}
    <span class="lenshint">${ts.length>1?`${ts.length} tracks — one song, pick what you play`:'1 track'}</span>
  </div>`;
}
/* D-3 — find the selected track's per-section cell (level + techniques) by the section's start bar */
function sectionCell(it, startBar, trackId){
  const secs=(it.data&&it.data.sections)||[];
  const sec=secs.find(s=>s.startBar===startBar);
  return sec ? ((sec.tracks||[]).find(c=>c.track===trackId)||null) : null;
}
/* D-3 — the Techniques column (sits between title and bars), scoped to the selected track */
function diffTechs(cell){
  const t = (cell && cell.techniques) ? cell.techniques : [];
  if(!t.length) return `<span class="techs"><span class="technone">—</span></span>`;
  return `<span class="techs">${t.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</span>`;
}
/* D-3 — the Level column, scoped to the selected track ("—" = the track is silent here) */
function diffLevel(cell){
  if(!cell) return `<span class="lvlpill" style="opacity:.4" title="this track is silent in this section">—</span>`;
  return `<span class="lvlpill ${cell.level===0?'debut':''}">${lvlText(cell.level)}</span>`;
}
/* D-2 — one media row with its 3-source provider badge */
function mediaRow(m){
  const kindIcon = m.kind==='video'?'smart_display':'volume_up';
  const prov = PROVIDER[m.provider]||{label:m.provider,cls:''};
  const loc = m.provider==='youtube'?esc(m.url):m.provider==='s3'?esc(m.s3_key):'lives inside the .gp file';
  return `<div class="patrow" style="cursor:default">
    <span class="material-symbols-outlined" style="color:var(--accent)">${kindIcon}</span>
    <div style="flex:1;min-width:0"><b>${esc(m.label)}</b><small style="color:var(--faint);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${loc}${m.note?' · '+esc(m.note):''}</small></div>
    <span class="src ${prov.cls}" title="provider=${esc(m.provider)}">${prov.label}</span></div>`;
}
/* D-2 — media for the selected track + the whole song; 3 sources */
function mediaCard(it, track){
  const tm = track ? trackMedia(it, track.id) : [];
  const sm = songMedia(it);
  if(!tm.length && !sm.length) return '';
  return `<div class="card"><h3><span class="material-symbols-outlined">library_music</span> Audio &amp; video <span style="font-weight:400;color:var(--faint)">· song-level + per-track · 3 sources (D-2)</span></h3>
    ${tm.length?`<div class="mediscope">This track · ${esc(track.name||cap(track.instrument))}</div>${tm.map(mediaRow).join('')}`:''}

    <small style="color:var(--faint);display:block;margin-top:6px">DB: <code>media</code> keyed by <code>playable_id</code> + optional <code>track_id</code> — many per scope. <code>has_audio/has_video</code> are derived facets.</small>
  </div>`;
}
function metaFoot(it){
  const bits=[];
  if(it.origin==='user-upload'){ bits.push(it.visibility==='private'?'<span class="tag private">Private</span>':'<span class="tag">Upload</span>'); if(it.owner) bits.push('owner: '+esc(it.owner)); }

  return `<div class="metafoot"><span class="material-symbols-outlined">info</span>${bits.join(' · ')}</div>`;

/* ---------- screen: STEP detail (a lesson step → its reusable pattern; prev/next within the lesson) ---------- */
function stepFieldsPanel(parent, s){
  const f = {parent_id:parent.id, child_id:s.child_id, sort_order:s.sort_order, start_bpm:s.start_bpm??null, goal_bpm:s.goal_bpm??null};
  const grid = Object.keys(f).map(k=>`<span class="nfk">${k}</span>${nfv(f[k])}`).join('');
  return `<aside class="fielddock"><div class="fdhead"><span class="material-symbols-outlined" style="font-size:15px">data_object</span> step · junction</div><div class="fdbody"><div class="nfsub">the locked step row — points at a reusable child pattern</div><div class="nfgrid">${grid}</div></div></aside>`;
}
function renderStep(lessonId, n){
  const it = PLAYABLES.find(x=>x.id===lessonId); if(!it) return notFound();

  const child = childPlayable(s.child_id) || {title:s.child_id, pattern_kind:null};
  const k = PATTERN_KINDS[child.pattern_kind]||{label:'Pattern',icon:'extension'};
  const prev = idx>0 ? steps[idx-1] : null;
  const next = idx<steps.length-1 ? steps[idx+1] : null;
  app.innerHTML = `
    ${crumbs([['#/catalog','Catalog'],['#/lesson/'+it.id,'Lesson · '+esc(it.title)],['','Step '+n]])}

      <div class="meta">

        <h1>${esc(child.title)}</h1>
        <div class="sub"><span class="tag lesson">${k.label}</span> <a data-nav="#/pattern/${s.child_id}" style="color:var(--accent);cursor:pointer">open pattern →</a> ${reuseCount(s.child_id)>1?`<span class="badge" style="padding:3px 9px">reused ×${reuseCount(s.child_id)}</span>`:''}</div>
        ${descOf(child)?`<p class="lead">${esc(descOf(child))}</p>`:''}
        <div class="badges">
          <span class="badge"><span class="material-symbols-outlined">speed</span><span class="mono">${s.start_bpm??'?'} → ${s.goal_bpm??'?'}</span> BPM ladder</span>
          <span class="badge"><span class="material-symbols-outlined">tag</span>step ${s.sort_order} of ${steps.length}</span>
        </div>

/* inline per-step field panel (Inspector toggle): shows the locked `step` junction row */
function stepFieldsInline(parent, s){
  const child = childPlayable(s.child_id);
  const f = {
    parent_id: parent.id,
    child_id: s.child_id,
    sort_order: s.sort_order,
    start_bpm: s.start_bpm ?? null,
    goal_bpm: s.goal_bpm ?? null,
  };
  const grid = Object.keys(f).map(k=>`<span class="nfk">${k}</span>${nfv(f[k])}`).join('');
  return `<div class="nfields"><div class="nfsub">step · the locked junction (parent_id, child_id, sort_order, start/goal bpm)</div><div class="nfgrid">${grid}</div>
    <div class="nfsub" style="color:var(--accent)">↳ child = reusable <code>${esc(s.child_id)}</code>${child?` · “${esc(child.title)}”`:''} — reused in ${reuseCount(s.child_id)} playable(s). The notation lives on the child pattern, not the step.</div></div>`;
}
function stepRow(parent, s){
  const child = childPlayable(s.child_id) || {title:s.child_id, pattern_kind:null};
  const k = PATTERN_KINDS[child.pattern_kind]||{label:'Pattern',icon:'extension'};
  const reuse = reuseCount(s.child_id);
  const composite = stepsFor(s.child_id).length>0;
  const ladder = (s.start_bpm||s.goal_bpm) ? `<span class="ladder"><span class="material-symbols-outlined" style="font-size:14px">speed</span>${s.start_bpm??'?'}→${s.goal_bpm??'?'}</span>` : '';
  const meta = [k.label, composite?'composite':null, reuse>1?`reused ×${reuse}`:null].filter(Boolean).join(' · ');
  return `<div class="stepwrap"><div class="step">
    <span class="no">${s.sort_order}</span>
    <div class="si" data-nav="${parent.kind==='lesson'?`#/lesson/${parent.id}/step/${s.sort_order}`:`#/pattern/${s.child_id}`}"><b>${esc(child.title)}</b><small>${meta}</small></div>
    ${ladder} <span class="src tex">${k.label}</span> ${signedIn()?donut(child.best):''}
    ${isAdmin()?`<button class="adminbtn" title="Edit step" data-nav="#/admin/lesson/${parent.id}/step/${s.sort_order}/edit"><span class="material-symbols-outlined">edit</span></button>`:''}
    <button class="play" title="Play this step" data-nav="#/play/${parent.id}/step/${s.sort_order}"><span class="material-symbols-outlined">play_arrow</span></button>
  </div>${stepFieldsInline(parent, s)}</div>`;
}

/* ---------- shared ---------- */
const PLAY_AGO = ['Today','Yesterday','3 days ago','Last week','2 weeks ago','3 weeks ago','Last month','6 weeks ago','2 months ago','3 months ago'];
function recentPlays(it){ const tr=(it.trend||[]); return tr.slice().reverse().slice(0,5).map((score,i)=>({score, ago: PLAY_AGO[i]||((i+1)+' plays ago')})); }   // $PL1 latest plays (derived from the trend for the wireframe)
function historyCard(it){
  if(!signedIn()) return `<div class="card" style="margin-top:0;min-width:240px">
      <div class="gate"><span class="material-symbols-outlined">login</span><div>Sign in to track your best score, sessions &amp; trend.<br>
      <button class="btn primary" id="signinHere" style="margin-top:10px"><span class="material-symbols-outlined">person</span> Sign in</button></div></div></div>`;
  const tr = (it.trend||[]); const max=Math.max(100,...tr);
  if(it.best==null && !tr.length) return `<div class="card" style="margin-top:0;min-width:240px"><h3><span class="material-symbols-outlined">history</span> Your history</h3>
      <div class="gate" style="border-style:dashed"><span class="material-symbols-outlined">flag</span>Not attempted yet — play it to start your trend.</div></div>`;
  const reset = it.best==null && tr.length>0;   // SD-21: best cleared, attempt history kept
  const done  = it.best!=null && it.best>=90;   // SD-21: 'completed' (placeholder: passed ≥ 90%)
  return `<div class="card" style="margin-top:0;min-width:240px">
    <h3><span class="material-symbols-outlined">history</span> Your history ${done?'<span class="pill-new" style="background:color-mix(in srgb,var(--s-high) 18%,transparent);color:var(--s-high)">✓ Completed</span>':''}${reset?'<span class="pill-new" style="background:var(--panel2);color:var(--faint)">best reset</span>':''}</h3>
    <div class="history">
      <div class="big">${donut(it.best)}
        <div class="stat"><span class="n">${it.sessions||0}</span><span class="l">sessions</span></div>
        ${it.top_bpm?`<div class="stat"><span class="n mono">${it.top_bpm}</span><span class="l">top BPM</span></div>`:''}
      </div>
      <div class="trend">${tr.map(v=>`<span style="height:${Math.round(v/max*100)}%"></span>`).join('')||'<small style="color:var(--faint)">no runs yet</small>'}</div>
    </div>
    ${tr.length?`<div style="margin-top:12px"><div style="font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);margin-bottom:2px">Recent plays</div>${recentPlays(it).map(p=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:12.5px;border-top:1px solid var(--line)"><span style="color:var(--muted)">${p.ago}</span><span class="mono" style="color:var(--s-${band(p.score)});font-weight:700">${p.score}%</span></div>`).join('')}</div>`:''}
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px">
      <small style="color:var(--faint)">Per-user (DynamoDB) — joined client-side.</small>
      ${it.best!=null?`<a data-reset="${it.id}" style="color:var(--accent);cursor:pointer;font-size:12px;white-space:nowrap" title="Clear your best — keep attempt history">Reset best</a>`:''}
    </div>
  </div>`;
}

function setRole(r){ state.role=r; localStorage.setItem('nh_role',r); closeModal(); render(); }
function setTheme(t){ state.theme=t; localStorage.setItem('nh_theme',t); render(); }
function openModal(){ el('#modal').classList.add('open'); }
function closeModal(){ el('#modal').classList.remove('open'); }
function clearFilter(g){
  if(g==='level'){ state.level={min:null,max:null}; state.inclUngraded=false; }
  else if(g==='bpm'){ state.bpm={min:null,max:null}; }
  else if(g==='score'){ state.score={min:null,max:null}; state.inclUnplayed=false; }

  else state[g]=[];
  state.page=1;
}

  const navEl = e.target.closest('[data-nav]');
  if(navEl){ navigate(navEl.dataset.nav); return; }
  const artistEl = e.target.closest('[data-artist]');
  if(artistEl){ navigate('#/catalog?tab=songs&artist='+encodeURIComponent(artistEl.dataset.artist)); return; }
  if(e.target.closest('[data-clear-artist]')){ state.artist=null; state.page=1; renderCatalog(); return; }
  const ap = e.target.closest('[data-artist-pick]');
  if(ap){ const a=ap.dataset.artistPick; state.artist = state.artist===a?null:a; state.openPop=null; state.page=1; renderCatalog(); return; }
  const rs = e.target.closest('[data-reset]');
  if(rs){ const p=PLAYABLES.find(x=>x.id===rs.dataset.reset); if(p){ p.best=null; }/* SD-21: clear best, keep trend */ render(); return; }
  if(e.target.closest('[data-back]')){ history.length>1?history.back():navigate('#/catalog'); return; }
  const popBtn = e.target.closest('[data-pop]');
  if(popBtn){ const id=popBtn.dataset.pop; state.openPop = state.openPop===id?null:id; renderCatalog(); return; }
  const mg = e.target.closest('[data-mg]');
  if(mg){ const g=mg.dataset.mg, v=mg.dataset.val; const a=state[g]; const i=a.indexOf(v); i>=0?a.splice(i,1):a.push(v); state.page=1; renderCatalog(); return; }
  const si = e.target.closest('[data-si]');
  if(si){ const v=si.dataset.val; state.instrument = state.instrument===v?null:v; if(!isPitched()) state.musicalKey=[]; state.openPop=null; state.page=1; renderCatalog(); return; }
  const tg = e.target.closest('[data-toggle]');
  if(tg){ state[tg.dataset.toggle]=!state[tg.dataset.toggle]; state.page=1; renderCatalog(); return; }
  const so = e.target.closest('[data-sort]');
  if(so){ state.sort=so.dataset.sort; state.openPop=null; renderCatalog(); return; }
  const cl = e.target.closest('[data-clear]');
  if(cl){ clearFilter(cl.dataset.clear); renderCatalog(); return; }
  if(!e.target.closest('.fpop') && !e.target.closest('[data-pop]') && state.openPop){ state.openPop=null; renderCatalog(); }
  if(e.target.closest('[data-tab]')){ state.tab=e.target.closest('[data-tab]').dataset.tab; state.page=1; state.openPop=null; renderCatalog(); return; }
  if(e.target.closest('[data-more]')){ state.advanced=!state.advanced; renderCatalog(); return; }
  if(e.target.closest('[data-fields]')){ state.showAll=!state.showAll; document.body.classList.toggle('showall', state.showAll); document.querySelectorAll('[data-fields]').forEach(b=>b.setAttribute('aria-pressed', String(state.showAll))); return; }
  if(e.target.closest('[data-page]')){ state.page=+e.target.closest('[data-page]').dataset.page; renderCatalog(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  if(e.target.closest('#clearAll')){ ['genre','kind','timeSig','skill','musicalKey'].forEach(g=>state[g]=[]); clearFilter('level'); clearFilter('bpm'); clearFilter('score'); state.instrument=null; state.artist=null; state.q=''; el('#q').value=''; state.page=1; renderCatalog(); return; }
  if(e.target.closest('[data-role-set]')){ setRole(e.target.closest('[data-role-set]').dataset.roleSet); return; }
  if(e.target.closest('[data-theme-set]')){ setTheme(e.target.closest('[data-theme-set]').dataset.themeSet); return; }
  if(e.target.closest('#acctBtn') || e.target.closest('#signinHere')){ openModal(); return; }
  if(e.target.closest('#modalX') || e.target===el('#modal')){ closeModal(); return; }
  if(e.target.closest('#uploadBtn')){ navigate('#/admin/new?type=upload'); return; }
});
document.addEventListener('change', e=>{
  if(e.target.matches('[data-track-sel]')){ state.track = e.target.value; render(); return; }
  const r = e.target.dataset.range; if(!r) return;
  let val = e.target.value===''?null:+e.target.value;
  if(val!=null && (r==='scoreMin'||r==='scoreMax')) val=Math.max(0,Math.min(100,val));
  if(r==='levelMin') state.level.min=val;
  else if(r==='levelMax') state.level.max=val;
  else if(r==='bpmMin') state.bpm.min=val;
  else if(r==='bpmMax') state.bpm.max=val;
  else if(r==='scoreMin') state.score.min=val;
  else if(r==='scoreMax') state.score.max=val;
  state.page=1; renderCatalog();
});
el('#q').addEventListener('input', e=>{ state.q=e.target.value; state.page=1; const onCat=(parseHash().seg[0]||'catalog')==='catalog'; if(onCat) renderCatalog(); else navigate('#/catalog'); });
window.addEventListener('hashchange', ()=>{ render(); window.scrollTo(0,0); });
window.addEventListener('keydown', e=>{ if(e.key==='Escape'){ closeModal(); if(state.openPop){ state.openPop=null; renderCatalog(); } } });

/* ---------- boot ---------- */
el('#brandMark').innerHTML = MARK_SVG;
el('#midiBtn').innerHTML = MIDI_SVG;
render();
</script>
</body>
</html>
