# lefthook — pnpm workspaces (no Nx).
# pre-commit stays fast (format + guards on STAGED files); pre-push runs the
# wider net (lint + typecheck + test across packages). Skipped on merge/rebase
# so conflict-resolution / history-rewrite commits don't fight the hooks.
# Worktree note: lefthook >= 2.1.9; if hooks ever stop firing in a worktree,
# run `lefthook install --reset-hooks-path` (resets the inherited core.hooksPath).

pre-commit:
  parallel: false
  commands:
    layout-guard:
      run: bash tooling/check-layout.sh
      skip: [merge, rebase]
    secret-scan:
      run: bash tooling/gitleaks-precommit.sh
      skip: [merge, rebase]
    sast:
      run: bash tooling/semgrep-precommit.sh
      skip: [merge, rebase]
    format:
      glob: '*.{ts,tsx,js,jsx,mjs,cjs,json,md,yml,yaml,css,html}'
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
      skip: [merge, rebase]

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
      skip: [merge, rebase]

pre-push:
  parallel: false
  commands:
    lint:
      run: pnpm -r --if-present run lint
      skip: [merge, rebase]
    typecheck:
      run: pnpm -r --if-present run typecheck
      skip: [merge, rebase]
    test:
      run: pnpm -r --if-present run test
      skip: [merge, rebase]
