# lefthook.yml — notation-hero (pnpm 11.5.2 workspaces, hexagonal monorepo)
# Docs: https://lefthook.dev/configuration/
#
# pre-commit: fast feedback on STAGED work — the layout guard (same script CI runs)
#             + lint/typecheck across workspace packages (pnpm -r, root scripts).
# pre-push:   wider safety net — lint/typecheck/test across workspace packages.
#
# Skip on merge/rebase so conflict-resolution / history-rewrite commits don't fight the hooks.
# Worktree note: lefthook >= 2.1.9 resolves the shim via `git rev-parse --show-toplevel`
# (fixes the deleted-worktree dead-path bug). Re-run `lefthook install` in the
# worktree you actively develop in if hooks ever stop firing.

pre-commit:
  parallel: false
  commands:
    # 1) Layout guard — blocks __tests__/ · __mocks__/ · stories/ dirs BEFORE they're committed.
    layout-guard:
      run: bash tooling/check-layout.sh
      skip:
        - merge
        - rebase
    # 2) gitleaks secret scan on STAGED changes (local best-effort; CI is authoritative — E-gitleaks).
    secret-scan:
      run: bash tooling/gitleaks-precommit.sh
      skip:
        - merge
        - rebase
    # 3) semgrep SAST on STAGED source (local best-effort; CI is authoritative — E-semgrep).
    sast:
      run: bash tooling/semgrep-precommit.sh
      skip:
        - merge
        - rebase
    # 4) lint + typecheck across workspace packages on commit (root scripts wrap `pnpm -r`).
    # NOTE: Coverage-ignore guard runs in CI only (see ci.yml `quality` job). Same policy
    # as gitleaks/semgrep: CI is authoritative for whole-tree gates; pre-commit stays fast.
    lint-typecheck:
      run: pnpm run lint && pnpm run typecheck
      skip:
        - merge
        - rebase

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
      skip:
        - merge
        - rebase

pre-push:
  parallel: false
  commands:
    # Wider net before sharing: lint + typecheck + test across all workspace packages.
    verify:
      run: pnpm run lint && pnpm run typecheck && pnpm run test
      skip:
        - merge
        - rebase
    # Non-blocking heads-up (NH-16): list active worktrees so you notice overlapping
    # work before pushing — the one overlap signal CI structurally can't see. Always
    # passes (informational); the PR checklist's "overlapping work" item is the record.
    worktree-reminder:
      run: |
        echo "ℹ️  Active git worktrees — watch for overlapping work before pushing:"
        git worktree list || true
      skip:
        - merge
        - rebase
