# lefthook — pnpm workspaces (no Nx).
# pre-commit: auto-fix + re-stage STAGED files (fast, glob-scoped).
# pre-push: full check vs origin/master; fails the push if unclean.
# Skipped on merge/rebase so conflict-resolution / history-rewrite commits don't fight hooks.
# Binary tools (shellcheck) are guarded inside their scripts — missing binary = skip locally.
# Worktree: if hooks stop firing in a worktree, run `lefthook install --reset-hooks-path`
# (the prepare script runs this automatically on install).

pre-commit:
  parallel: false
  commands:
    layout-guard:
      run: bash tooling/check-layout.sh
      skip: [merge, rebase]
    secret-scan:
      run: bash tooling/gitleaks-precommit.sh
      skip: [merge, rebase]
    sast:
      run: bash tooling/semgrep-precommit.sh
      skip: [merge, rebase]
    prettier:
      glob: '*.{ts,tsx,js,jsx,mjs,cjs,json,md,yml,yaml,css,html}'
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
      skip: [merge, rebase]
    # ESLint lives in client/ + server/ (per-package flat configs; no root install).
    # Flat config resolves ONE config from CWD, so run eslint inside each package
    # via lefthook `root:` — {staged_files} are filtered to that root and made relative.
    eslint-client:
      root: 'client/'
      glob: '*.{ts,tsx,js,jsx,mjs,cjs}'
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true
      skip: [merge, rebase]
    eslint-server:
      root: 'server/'
      glob: '*.{ts,mjs,cjs,js}'
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true
      skip: [merge, rebase]
    stylelint:
      glob: '*.css'
      run: pnpm exec stylelint --fix {staged_files}
      stage_fixed: true
      skip: [merge, rebase]
    markdownlint:
      glob: '*.md'
      run: pnpm exec markdownlint-cli2 --fix {staged_files}
      stage_fixed: true
      skip: [merge, rebase]
    sort-package-json:
      glob: '*package.json'
      run: pnpm exec sort-package-json {staged_files}
      stage_fixed: true
      skip: [merge, rebase]
    shellcheck-fix:
      glob: '*.sh'
      run: bash tooling/shellcheck-fix.sh {staged_files}
      stage_fixed: true
      skip: [merge, rebase]

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
      skip: [merge, rebase]

pre-push:
  parallel: false
  commands:
    format:
      run: pnpm exec prettier --check --ignore-unknown .
      skip: [merge, rebase]
    lint:
      run: pnpm -r --if-present run lint
      skip: [merge, rebase]
    lint-css:
      run: pnpm run lint:css
      skip: [merge, rebase]
    lint-md:
      run: pnpm run lint:md
      skip: [merge, rebase]
    lint-spell:
      run: pnpm run lint:spell
      skip: [merge, rebase]
    lint-editorconfig:
      run: pnpm run lint:editorconfig
      skip: [merge, rebase]
    lint-yaml:
      run: if command -v yamllint >/dev/null 2>&1; then pnpm run lint:yaml; else echo "yamllint missing — skipped (CI gates)"; fi
      skip: [merge, rebase]
    lint-shell:
      run: if command -v shellcheck >/dev/null 2>&1; then pnpm run lint:shell; else echo "shellcheck missing — skipped (CI gates)"; fi
      skip: [merge, rebase]
    lint-actions:
      run: if command -v actionlint >/dev/null 2>&1; then pnpm run lint:actions; else echo "actionlint missing — skipped (CI gates)"; fi
      skip: [merge, rebase]
    typecheck:
      run: pnpm -r --if-present run typecheck
      skip: [merge, rebase]
    test:
      run: pnpm -r --if-present run test
      skip: [merge, rebase]
