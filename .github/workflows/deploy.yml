name: Deploy

# CD for the ARCH-EDGE-1 AWS slice (NH-206). Auth = GitHub -> AWS OIDC (no stored keys);
# Pulumi state = self-managed S3 backend (pinned in infra/Pulumi.yaml). Push to master ->
# `pulumi up` only. `pulumi preview` is LOCAL-ONLY (NH-206 review #3): a PR-triggered preview
# ran arbitrary infra/*.ts under the full deploy role, so PRs now carry NO AWS credentials.
# Run `pulumi preview` locally before merging infra changes — see
# docs/specs/2026-06-24-nh-206-oidc-deploy-hardening.md.
on:
  push:
    branches: [master]

# id-token: assume the AWS role via OIDC. No `pull-requests` perm — no PR job touches AWS now.
permissions:
  id-token: write
  contents: read

jobs:
  up:
    name: Pulumi up
    # The master-restricted `production` environment is the SECOND gate alongside the OIDC trust:
    # the deploy role trusts ONLY `...:environment:production`, a subject GitHub mints solely for a
    # job that references this environment — and the environment is limited to the master branch.
    environment: production
    runs-on: ubuntu-latest
    # First CloudFront create can take ~15-20 min; this timeout is a hung-job backstop. NOTE: a
    # hard-killed `pulumi up` does NOT release the S3-backend lock — it strands it (the next run
    # needs `pulumi cancel`). The timeout frees the concurrency group, not the lock.
    timeout-minutes: 60
    # Never cancel an in-flight `up` — a half-applied deploy can corrupt stack state.
    concurrency:
      group: deploy-up-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-js
      - name: Build Lambda + SPA (pulumi reads server/dist-lambda + client/dist)
        run: |
          pnpm --filter @notation-hero/server run build:lambda
          pnpm --filter @notation-hero/client run build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          # Pin the OIDC token audience to AWS STS (defence-in-depth; the role trust also
          # enforces aud = sts.amazonaws.com). NH-206 review #3, H2.
          audience: sts.amazonaws.com
          mask-aws-account-id: true
      - uses: pulumi/actions@v6
        with:
          command: up
          stack-name: dev
          work-dir: infra
          cloud-url: s3://${{ vars.PULUMI_STATE_BUCKET }}
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
