name: CI

on:
  push:
    branches: [master]
  pull_request:

# Cancel superseded runs on the same ref (saves minutes, avoids stale results).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decide which layers changed. Filters are DEPENDENCY-AWARE: a consumer is
  # re-checked when something it depends on changes (apps depend on core +
  # shared config; infra depends on the aws adapter). Root files
  # (manifest / lockfile / base tsconfig / this workflow) trip everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      adapters: ${{ steps.filter.outputs.adapters }}
      app: ${{ steps.filter.outputs.app }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'core/**'
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
              - 'tsconfig.base.json'
              - '.github/workflows/ci.yml'
            adapters:
              - 'adapters/**'
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
              - 'tsconfig.base.json'
              - '.github/workflows/ci.yml'
            app:
              - 'apps/**'
              - 'core/**'
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
              - 'tsconfig.base.json'
              - '.github/workflows/ci.yml'
            infra:
              - 'infra/**'
              - 'adapters/**'
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
              - 'tsconfig.base.json'
              - '.github/workflows/ci.yml'

  core:
    needs: changes
    if: ${{ needs.changes.outputs.core == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run --filter='@core/*' lint
      - run: bun run --filter='@core/*' typecheck
      - run: bun run --filter='@core/*' test
      - run: bun run --filter='@core/*' build

  adapters:
    needs: changes
    if: ${{ needs.changes.outputs.adapters == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run --filter='@adapters/*' lint
      - run: bun run --filter='@adapters/*' typecheck
      - run: bun run --filter='@adapters/*' test
      - run: bun run --filter='@adapters/*' build

  app:
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run --filter='@apps/*' lint
      - run: bun run --filter='@apps/*' typecheck
      - run: bun run --filter='@apps/*' test
      - run: bun run --filter='@apps/*' build

  infra:
    needs: changes
    if: ${{ needs.changes.outputs.infra == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run --filter='@notation-hero/infra' lint
      - run: bun run --filter='@notation-hero/infra' typecheck
      - run: bun run --filter='@notation-hero/infra' build

  # Single REQUIRED status check for branch protection. Always runs, so it never
  # deadlocks when a path-filtered job is skipped. Fails only if a needed job
  # actually failed or was cancelled (skipped is fine).
  ci-green:
    name: CI Green
    if: always()
    needs: [core, adapters, app, infra]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs passed
        run: |
          results=("${{ needs.core.result }}" "${{ needs.adapters.result }}" "${{ needs.app.result }}" "${{ needs.infra.result }}")
          echo "core=${{ needs.core.result }} adapters=${{ needs.adapters.result }} app=${{ needs.app.result }} infra=${{ needs.infra.result }}"
          for r in "${results[@]}"; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "::error::A required CI job did not pass"
              exit 1
            fi
          done
          echo "All required jobs passed (skipped is OK)."
