name: CI

on:
  push:
    branches: [master]
  pull_request:

# Cancel superseded runs on the same ref (saves minutes, avoids stale results).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decide which subtrees changed so we only run the jobs that matter.
  # Root files (manifest / lockfile / base tsconfig / this workflow) trip BOTH.
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'package.json'
              - 'bun.lock'
              - 'tsconfig.base.json'
              - '.github/workflows/ci.yml'
            infra:
              - 'infra/**'
              - 'package.json'
              - 'bun.lock'
              - 'tsconfig.base.json'
              - '.github/workflows/ci.yml'

  web:
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run --filter='@notation-hero/web' lint
      - run: bun run --filter='@notation-hero/web' typecheck
      - run: bun run --filter='@notation-hero/web' test
      - run: bun run --filter='@notation-hero/web' build

  infra:
    needs: changes
    if: ${{ needs.changes.outputs.infra == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run --filter='@notation-hero/infra' typecheck
      - run: bun run --filter='@notation-hero/infra' build

  # Single REQUIRED status check for branch protection. Always runs, so it never
  # deadlocks when a path-filtered job is skipped. Fails only if a needed job
  # actually failed or was cancelled (skipped is fine).
  ci-green:
    name: CI Green
    if: always()
    needs: [web, infra]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs passed
        run: |
          web="${{ needs.web.result }}"
          infra="${{ needs.infra.result }}"
          echo "web=$web  infra=$infra"
          if [[ "$web" == "failure" || "$web" == "cancelled" || "$infra" == "failure" || "$infra" == "cancelled" ]]; then
            echo "::error::A required CI job did not pass"
            exit 1
          fi
          echo "All required jobs passed (skipped is OK)."
