name: CI

on:
  push:
    branches: [master]
  pull_request:
    # `edited` re-validates pr-title when the title/body/label changes (squash uses
    # the PR title as the master subject). Path-filtered jobs still skip on
    # metadata-only edits via the `changes` filter, so cost stays low.
    types: [opened, edited, synchronize, reopened]
  # merge_group fires when GitHub's merge queue builds the combined state of queued
  # PRs and runs CI on it — catches two independently-green PRs that interact badly.
  # Free on public repos. pr-title/pr-checklist are pull_request-only (skip here;
  # ci-green treats skipped as OK).
  merge_group:

# Cancel superseded runs on the same ref (saves minutes, avoids stale results).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Path filter so docs-only PRs skip the build/quality jobs (the single required
  # "CI Green" check still passes — no skipped-required-check deadlock).
  # ADD new root config files here or quality/build silently skip on changes to them.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
        id: filter
        with:
          filters: |
            code:
              - 'client/**'
              - 'server/**'
              - 'shared/**'
              - 'infra/**'
              - 'tooling/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
              - '.dependency-cruiser.cjs'
              - 'knip.json'
              - '.syncpackrc.json'
              - '.semgrepignore'
              - 'lefthook.yml'
              - 'commitlint.config.*'
              - '.github/workflows/ci.yml'
            infra:
              - 'infra/**'

  # Lint + typecheck + hexagon layer-boundary check (dependency-cruiser) +
  # version consistency (syncpack) + tests, across every workspace via `pnpm -r`.
  quality:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Layout guard (role suffixes; no __tests__/ or stories/ dirs)
        run: bash tooling/check-layout.sh
      - name: Coverage-ignore guard (no istanbul/c8/v8 ignore)
        run: bash tooling/check-no-coverage-ignore.sh
      - uses: ./.github/actions/setup-js
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Dependency boundaries (hexagon)
        run: pnpm run depcheck
      - name: Core-purity canary (proves the hexagon fence rejects core -> framework)
        run: pnpm run check:core-purity
      - name: Dependency versions (syncpack)
        run: pnpm run syncpack
      - name: Test
        run: pnpm run test
      - name: Tooling unit tests (node --test)
        run: pnpm run test:tooling

  # Per-package build via `pnpm -r run build`.
  build:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-js
      - run: pnpm run build

  # Accessibility — axe-core (WCAG 2 A+AA) over the Storybook stories via Playwright,
  # in light + dark. Deterministic (no pixel baselines, unlike VR), so it's a real
  # required gate. Path-filtered on `code`. Violations print in the job log with the
  # rule + measured contrast ratio + the two colors.
  a11y:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-js
      - name: Install Playwright Chromium
        run: pnpm --filter @notation-hero/client exec playwright install --with-deps chromium
      - name: Accessibility tests (axe + Storybook)
        run: pnpm --filter @notation-hero/client run test:a11y

  # Visual regression — Playwright toHaveScreenshot over the Storybook stories. Runs IN
  # the official Playwright container so rendering matches the committed *-linux.png
  # baselines exactly (those are generated locally via the same image — see AGENTS.md
  # "VR baselines"). Path-filtered on `code`; blocks merge alongside a11y.
  vr:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # NOT the setup-js composite: inside the Playwright container, use the image's Node
      # + corepack (pnpm@11.5.2 from packageManager) and --ignore-scripts. pnpm/action-setup
      # conflicts with the image's pnpm layout, and the lefthook `prepare` can't run here
      # (no git hooks needed in CI). Browsers are baked into the image — no `playwright install`.
      - name: Install deps
        run: corepack enable && pnpm install --frozen-lockfile --ignore-scripts
      - name: Visual regression (vs committed Linux baselines)
        run: pnpm --filter @notation-hero/client run test:vr

  # Secret scanning — gitleaks over the full history. Runs on EVERY change (a
  # secret can land in any file). Free on public/personal repos.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  # SAST — Semgrep over source. Path-filtered on `code`. Free community rulesets.
  sast:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: pip install semgrep
      - name: Semgrep SAST
        run: semgrep scan --config auto --error

  # Dependency CVE gate — osv-scanner over the lockfile. Path-filtered on `code`.
  deps-cve:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --recursive
            ./

  # PR-title commitlint — GitHub squash uses the PR title as the master subject
  # for multi-commit PRs; the local commit-msg hook only covers local commits.
  # Bot-exempt (like pr-checklist): dependabot titles ("Bump …") aren't conventional and
  # we can't change them — the cost is their squash subject isn't commitlint-checked.
  pr-title:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-js
      - name: Validate PR title with commitlint
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint

  # Agent PR merge checklist (NH-16) — Jira-key presence + no-blank-boxes over the PR-template
  # items, plus the diff-aware infra-preview gate (NH-206 review #3): `needs: changes` brings the
  # `infra` paths-filter signal, so an infra/ PR must record its local pulumi-preview
  # classification. Always runs (PR-event only, bot-exempt). Pure Node.
  pr-checklist:
    needs: changes
    if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Dependency-free Node script — no `pnpm install` needed, so use setup-node + .nvmrc
      # directly instead of the ./.github/actions/setup-js composite (AGENTS.md "Exception").
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
      - name: PR checklist gate
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          PR_INFRA_CHANGED: ${{ needs.changes.outputs.infra }}
        run: node tooling/pr-checklist.mjs

  # Single REQUIRED status check for branch protection. Always runs, so a
  # path-filtered skip never deadlocks the merge (skipped is OK).
  ci-green:
    name: CI Green
    if: always()
    needs:
      [
        changes,
        quality,
        build,
        a11y,
        vr,
        secret-scan,
        sast,
        deps-cve,
        pr-title,
        pr-checklist,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs passed
        env:
          # `toJSON(needs)` reflects the `needs:` array above automatically, so the
          # `needs:` list is the SINGLE source of truth — adding a gate is a one-line
          # `needs:` edit and this step never changes (NH-22). Injected via env (not
          # inline in run) to avoid any script-injection surface.
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key)=\(.value.result)"' <<<"$NEEDS"
          # Gatekeeper: `changes` must SUCCEED. If it fails or skips, the path-gated
          # jobs (quality/build/sast/deps-cve) silently skip — which must not read as
          # green. Quoted key so a future hyphenated gatekeeper name still resolves;
          # evaluated on its own line so a jq error trips `set -e` instead of being
          # swallowed inside `[[ … ]]`.
          changes_result="$(jq -r '.["changes"].result' <<<"$NEEDS")"
          if [[ "$changes_result" != "success" ]]; then
            echo "::error::Gatekeeper job 'changes' did not succeed (result=$changes_result); path-gated jobs may have silently skipped"; exit 1
          fi
          # Allow-list (fail closed): every other required job must be `success` or
          # `skipped` (path filters legitimately skip). ANY other result — failure,
          # cancelled, or an unknown future value — fails the gate (ARCH-GUARD-1/CR-1:
          # prefer an allow-list over a deny-list for fences).
          bad="$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"' <<<"$NEEDS")"
          if [[ -n "$bad" ]]; then
            echo "::error::Required CI job(s) did not pass: $(tr '\n' ' ' <<<"$bad")"; exit 1
          fi
          echo "All required jobs passed (skipped is OK)."
