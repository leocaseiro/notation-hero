name: CI

on:
  push:
    branches: [master]
  pull_request:

# Cancel superseded runs on the same ref (saves minutes, avoids stale results).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Path filter so docs-only PRs skip the build jobs entirely (and the single
  # required "CI Green" check still passes — no skipped-required-check deadlock).
  # `code` = anything that can affect lint/typecheck/depcheck/test.
  # `apps`  = apps + their deps (core/adapters) — what a build needs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      apps: ${{ steps.filter.outputs.apps }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # ADD new root config files (eslint.config.*, lefthook.yml, dangerfile.ts, etc.)
          # here or quality/build will silently skip on changes to them. The ci-green
          # gate treats "skipped" as OK, so an unlisted file → no CI → false-green.
          # See DACI L7 (Sequencing Step 3 — CI cost/safety) + F-4/F-10 from PR #1 review.
          filters: |
            code:
              - 'core/**'
              - 'adapters/**'
              - 'apps/**'
              - 'infra/**'
              - 'tooling/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
              - '.eslintrc.cjs'
              - '.dependency-cruiser.cjs'
              - 'lefthook.yml'
              - 'nx.json'
              - '.github/workflows/ci.yml'
            apps:
              - 'apps/**'
              - 'core/**'
              - 'adapters/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
              - 'nx.json'
              - '.github/workflows/ci.yml'

  # Lint + typecheck + Hexagonal layer-boundary check (dependency-cruiser) + test.
  quality:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Layout guard (co-located tests — no __tests__/ or stories/)
        run: bash tooling/check-layout.sh
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Dependency boundaries (Hexagonal layers)
        run: pnpm run depcheck
      - name: Test
        run: pnpm run test

  # Per-deploy-target build. Runs every workspace's build via pnpm -r;
  # split into a per-app matrix if/when build time warrants.
  build:
    needs: changes
    if: ${{ needs.changes.outputs.apps == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

  # Secret scanning — gitleaks over the diff/history. Runs on EVERY change (NOT
  # path-filtered) — a secret can land in any file. Free on personal/public repos;
  # an org repo would need GITLEAKS_LICENSE. (decision-registry E-gitleaks)
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          # gitleaks-action v2 requires the token to scan PR commits (read-only is enough).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  # SAST — Semgrep over source. Path-filtered on `code` (no source change → skipped,
  # which the gate treats as OK). Free community rulesets via `--config auto`, no token.
  # (decision-registry E-semgrep)
  sast:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Semgrep
        run: pip install semgrep
      - name: Semgrep SAST
        run: semgrep scan --config auto --error

  # Dependency CVE gate — osv-scanner recursive scan over the repo tree (picks up
  # pnpm-lock.yaml). Path-filtered on `code`; fails the build on any known CVE (free
  # SCA). Pinned to an exact tag — the action warns it can change in a minor patch.
  # (decision-registry E-osv-scanner)
  deps-cve:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            --recursive
            ./

  # Single REQUIRED status check for branch protection. Always runs, so a
  # path-filtered skip never deadlocks the merge. Fails only on a real
  # failure/cancellation (skipped is OK).
  ci-green:
    name: CI Green
    if: always()
    needs: [quality, build, secret-scan, sast, deps-cve]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs passed
        run: |
          q="${{ needs.quality.result }}"
          b="${{ needs.build.result }}"
          s="${{ needs.secret-scan.result }}"
          a="${{ needs.sast.result }}"
          d="${{ needs.deps-cve.result }}"
          echo "quality=$q  build=$b  secret-scan=$s  sast=$a  deps-cve=$d"
          if [[ "$q" == "failure" || "$q" == "cancelled" || "$b" == "failure" || "$b" == "cancelled" || "$s" == "failure" || "$s" == "cancelled" || "$a" == "failure" || "$a" == "cancelled" || "$d" == "failure" || "$d" == "cancelled" ]]; then
            echo "::error::A required CI job did not pass"
            exit 1
          fi
          echo "All required jobs passed (skipped is OK)."
