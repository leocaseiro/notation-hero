default: true
# -- Emphasis/strong styles pinned explicitly (NOT the default 'consistent') --
# In 'consistent' mode the FIRST emphasis span in a file anchors the expected
# style, so one wrong-style span (e.g. a stray *loader* near the top of a doc)
# re-flags every pre-existing span far from the edit — a confusing cascade that
# looks like a version/parity bug but isn't. Explicit styles make a wrong span
# fail at its OWN line ("Expected: underscore") instead. Styles match repo
# convention (grep: **bold** on 6491 lines vs __bold__ on 44; _italic_ predominant).
MD049:
  style: underscore # italics use _x_ (decision-registry + repo convention)
MD050:
  style: asterisk # strong/bold uses **x**
# -- Rules mirrored from base-skill --
MD013: false # line-length: Prettier owns prose wrapping
MD024: false # no-duplicate-heading: used legitimately in ADRs / decision docs
MD033: false # no-inline-html: HTML is used in docs (badges, details, etc.)
MD036: false # no-emphasis-as-heading: emphasis-only paragraphs are intentional
MD040: false # fenced-code-language: many legacy snippets lack lang specifiers
MD041: false # first-line-heading: many docs start with frontmatter / prose
MD051: false # link-fragments: false positives on heading anchors
# -- Additional rules disabled for this repo (beyond base-skill) --
MD025: false # single-title: HANDOFF/changelog-style docs use multiple H1 headings intentionally
MD028: false # no-blanks-blockquote: blank lines inside blockquotes used deliberately for readability in many docs (22 violations, not auto-fixable)
MD046: false # code-block-style: false positive inside mermaid diagrams with `end` keyword
MD060: false # table-column-style: new in markdownlint v0.40, not in base-skill baseline; 51 violations across legacy docs (separator style, not auto-fixable)
