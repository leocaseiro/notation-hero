# pnpm workspace globs — mirrors the npm-style `workspaces` field that used
# to live in the root package.json. Source of truth for pnpm.
#
# `core/`, `adapters/`, `apps/` hold real Nx packages as of Wave 1 (DACI Step 1).
packages:
  - 'core/*'
  - 'adapters/*'
  - 'apps/*'
  - 'infra'
# Build-script approval. pnpm 11.5.2 uses the `allowBuilds: {pkg: true|false}` map
# (it IGNORES the older `onlyBuiltDependencies` list and re-injects this block as a
# prompt). @swc/core ships a postinstall build — it backs the NestJS server's SWC
# compile (added in 0.2). Approving it keeps a fresh `pnpm install --frozen-lockfile`
# green (e.g. CI), which otherwise fails with ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  '@swc/core': true
  lefthook: true
  # esbuild ships a platform binary via a postinstall build; the handler-hello
  # Lambda build (apps/handler-hello) bundles with it. Approve so a frozen CI
  # install stays green (ERR_PNPM_IGNORED_BUILDS otherwise).
  esbuild: true
  # import-x@4's native (Rust) module resolver. FALSE on purpose: the enforcement bundle uses
  # only import-x/no-default-export + import-x/order, neither of which needs the native resolver
  # (group classification works off node builtins + static heuristics). An explicit `false`
  # silences ERR_PNPM_IGNORED_BUILDS WITHOUT running a native build script we don't yet need.
  # Flip to true when resolver-backed rules (no-unresolved, internal/external precision) are
  # wired — likely with the flat-config migration (NH-42) or when real source lands.
  unrs-resolver: false
  # protobufjs ships a postinstall build; it backs @pulumi/pulumi's gRPC runtime
  # (transitive dep of the infra/ Pulumi program). Approve so a frozen CI install
  # stays green and `pulumi up` works (NH-150).
  protobufjs: true

# Security overrides — force patched versions of transitive deps flagged by the CI
# `deps-cve` gate (osv-scanner). pnpm 11 reads `overrides` here, NOT package.json's
# `pnpm.overrides` (that field is ignored). The two Pulumi-transitive MAJOR-bump CVEs
# (js-yaml, @opentelemetry/core) are deferred via osv-scanner.toml — see NH-191.
overrides:
  form-data: 4.0.6 # GHSA-hmw2-7cc7-3qxx (High 8.7); was 4.0.5
  tmp: 0.2.7 # GHSA-7c78-jf6q-g5cm (High 8.2); was 0.2.6
